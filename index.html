<!DOCTYPE html>
<html lang="en">

<style>

<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="tooltip"></div>
  <div id="info"></div>
  <div id="legend"><b>DRAG</b> to orbit &nbsp;·&nbsp; <b>SCROLL</b> to zoom &nbsp;·&nbsp; <b>CLICK</b> a seat</div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.165.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── φ / SACRED ───────────────────────────────────────────────────────────────
const PHI = 1.6180339887498948482;
const SACRED = [3,5,6,5,3,6,9,9,6,3];

// ─── COLOR SYSTEM (exact fol_globe_v4 logic) ─────────────────────────────────
const PHI_STOPS = [];
for(let i=0;i<8;i++){
  const hue=((i*360*(1-1/PHI))%360)/360, s=(1/PHI), l=0.55+(i%3)*(PHI-1)*0.06;
  const q=l<0.5?l*(1+s):l+s-l*s, p=2*l-q;
  const h2=(x)=>{x=((x%1)+1)%1;if(x<1/6)return p+(q-p)*6*x;if(x<.5)return q;if(x<2/3)return p+(q-p)*(2/3-x)*6;return p;};
  PHI_STOPS.push({r:Math.round(h2(hue+1/3)*255),g:Math.round(h2(hue)*255),b:Math.round(h2(hue-1/3)*255)});
}
const FIB=[1,1,2,3,5,8,5,3], HOLD=2.0, BLEND=2.5;
const CYCLE_T = FIB.reduce((a,f)=>a+f*HOLD+BLEND,0);
const STARTS=[]; let _s=0; for(let i=0;i<8;i++){STARTS.push(_s);_s+=FIB[i]*HOLD+BLEND;}
function getColor(t){
  const m=t%CYCLE_T; let idx=0;
  for(let i=7;i>=0;i--){if(m>=STARTS[i]){idx=i;break;}}
  const nx=(idx+1)%8, el=m-STARTS[idx], hd=FIB[idx]*HOLD;
  if(el<=hd)return{...PHI_STOPS[idx]};
  const e=(el-hd)/BLEND, ease=e*e*(3-2*e), a=PHI_STOPS[idx], b=PHI_STOPS[nx];
  return{r:a.r+(b.r-a.r)*ease, g:a.g+(b.g-a.g)*ease, b:a.b+(b.b-a.b)*ease};
}

// ─── CANVAS HELPER ────────────────────────────────────────────────────────────
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function mkTex(w,h,draw){const c=mkCanvas(w,h);draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.needsUpdate=true;return t;}

// ─── SACRED CIRCLE PAINTER ────────────────────────────────────────────────────
function paintRing(ctx,w,h,css){
  ctx.clearRect(0,0,w,h);
  const cx=w/2,cy=h/2,r=Math.min(w,h)*0.42,fs=11,cw=fs*0.62;
  const total=Math.floor((2*Math.PI*r)/cw);
  ctx.font=`bold ${fs}px Courier New`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=css;
  for(let i=0;i<total;i++){
    const a=(i/total)*Math.PI*2;
    ctx.save();ctx.translate(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.rotate(a+Math.PI/2);
    ctx.fillText(String(SACRED[i%10]),0,0);ctx.restore();
  }
}

// ─── GLOBE BUILDER ────────────────────────────────────────────────────────────
function makeGlobe(scale, cwTex, ccwTex){
  const group = new THREE.Group();
  const N=80, PHI_SQ=Math.PI*(3-Math.sqrt(5)), meshes=[];
  const geo = new THREE.PlaneGeometry(2*Math.sin(0.4)*1.02, 2*Math.sin(0.4)*1.02);
  for(let i=0;i<N;i++){
    const y=1-(i/(N-1))*2, r2=Math.sqrt(Math.max(0,1-y*y)), theta=PHI_SQ*i;
    const pole=new THREE.Vector3(r2*Math.cos(theta),y,r2*Math.sin(theta)).normalize();
    const isCW=i%2===0;
    const mat=new THREE.MeshBasicMaterial({
      map:isCW?cwTex:ccwTex, transparent:true, opacity:0.72,
      blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide
    });
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.copy(pole.clone().multiplyScalar(0.01));
    const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),pole);
    mesh.quaternion.copy(q);
    const pm=(PHI*(i+1))%1;
    mesh.userData={pole,isCW,baseQ:q.clone(),spd:0.01+pm*0.008,ph:(PHI*i*2.3)%(Math.PI*2),sf:0.4+pm*1.2};
    group.add(mesh); meshes.push(mesh);
  }
  group.scale.setScalar(scale);
  group.userData={meshes};
  return group;
}
function animGlobe(group, t){
  const ax=new THREE.Vector3(), qs=new THREE.Quaternion(), qb=new THREE.Quaternion();
  group.userData.meshes.forEach(m=>{
    const{pole,isCW,baseQ,spd,ph,sf}=m.userData;
    m.material.opacity=0.55+0.2*(Math.sin(t*sf+ph)*0.5+0.5);
    ax.copy(pole); qs.setFromAxisAngle(ax,t*(isCW?spd:-spd));
    m.quaternion.copy(qb.copy(baseQ).premultiply(qs));
  });
}

// ─── SCENE SETUP ──────────────────────────────────────────────────────────────
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.physicallyCorrectLights = true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.55;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x040202);
scene.fog=new THREE.FogExp2(0x040202,0.016);

const camera=new THREE.PerspectiveCamera(52,1,0.1,150);
camera.position.set(0,4.5,13);

// Post-processing
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),1.4,0.55,0.08));

function onResize(){
  const W=window.innerWidth,H=window.innerHeight;
  renderer.setSize(W,H); composer.setSize(W,H);
  camera.aspect=W/H; camera.updateProjectionMatrix();
}
onResize(); window.addEventListener('resize',onResize);

// ─── MATERIALS ────────────────────────────────────────────────────────────────
const RG={main:0xd4919e, dark:0xb86070, emissive:0x5a1822};
function rgMat(ei=0.5){return new THREE.MeshStandardMaterial({color:RG.main,roughness:0.18,metalness:0.95,emissive:RG.emissive,emissiveIntensity:ei});}
function darkMat(col=0x0a0505){return new THREE.MeshStandardMaterial({color:col,roughness:0.82,metalness:0.15});}

// Wall texture — black panels with rose-gold dado
function makeWallTex(W=2048,H=1024,pcols=5,prows=2){
  return mkTex(W,H,(ctx)=>{
    // Deep black lacquer base
    const baseG=ctx.createLinearGradient(0,0,W,H);
    baseG.addColorStop(0,'#080303'); baseG.addColorStop(0.5,'#050202'); baseG.addColorStop(1,'#060303');
    ctx.fillStyle=baseG; ctx.fillRect(0,0,W,H);
    // Micro grain — leather/lacquer feel
    for(let i=0;i<8000;i++){
      const a=(Math.random()*0.04).toFixed(3);
      ctx.fillStyle=`rgba(30,10,10,${a})`; ctx.fillRect(Math.random()*W,Math.random()*H,1,Math.random()>0.6?2:1);
    }
    // Deep recessed panels with rose-gold metallic bevel
    const pw=W/pcols,ph=H/prows,mg=pw*0.06;
    for(let px=0;px<pcols;px++) for(let py=0;py<prows;py++){
      const x=px*pw+mg,y=py*ph+mg,w=pw-mg*2,h=ph-mg*2;
      // Panel shadow depth
      const sdw=ctx.createLinearGradient(x,y,x+w,y+h);
      sdw.addColorStop(0,'rgba(0,0,0,0.65)'); sdw.addColorStop(0.5,'rgba(6,2,2,0.3)'); sdw.addColorStop(1,'rgba(0,0,0,0.55)');
      ctx.fillStyle=sdw; ctx.fillRect(x,y,w,h);
      // Outer rose-gold bevel
      ctx.strokeStyle='rgba(212,150,155,0.55)'; ctx.lineWidth=2.5; ctx.strokeRect(x,y,w,h);
      // Inner inset
      ctx.strokeStyle='rgba(183,110,121,0.15)'; ctx.lineWidth=1; ctx.strokeRect(x+9,y+9,w-18,h-18);
      // Metallic sheen
      const sheen=ctx.createLinearGradient(x,y,x,y+h);
      sheen.addColorStop(0,'rgba(255,200,180,0.05)'); sheen.addColorStop(1,'rgba(200,140,120,0.02)');
      ctx.fillStyle=sheen; ctx.fillRect(x+2,y+2,w-4,h-4);
    }
    // Dado rail — brushed rose-gold metallic band
    const d=H*0.38;
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,d+18,W,10);
    const railG=ctx.createLinearGradient(0,d,0,d+18);
    railG.addColorStop(0,'rgba(255,200,160,0.92)');
    railG.addColorStop(0.25,'rgba(225,160,130,0.95)');
    railG.addColorStop(0.65,'rgba(200,130,110,0.9)');
    railG.addColorStop(1,'rgba(170,100,85,0.8)');
    ctx.fillStyle=railG; ctx.fillRect(0,d,W,18);
    // Shine + shadow lines
    ctx.fillStyle='rgba(255,235,205,0.78)'; ctx.fillRect(0,d,W,2.5);
    ctx.fillStyle='rgba(90,40,30,0.85)'; ctx.fillRect(0,d+16,W,2);
    // Wainscot ribs below dado
    const ribCount=pcols*2+1, ribW=W/ribCount;
    for(let r=0;r<ribCount;r++){
      const rx=r*ribW;
      ctx.fillStyle='rgba(183,110,121,0.16)'; ctx.fillRect(rx,d+18,1.5,H-(d+18));
    }
    // Crown glow at top
    const crownG=ctx.createLinearGradient(0,0,0,32);
    crownG.addColorStop(0,'rgba(245,185,150,0.55)'); crownG.addColorStop(1,'rgba(183,110,121,0)');
    ctx.fillStyle=crownG; ctx.fillRect(0,0,W,32);
  });
}
function makeFloorTex(){
  return mkTex(2048,2048,(ctx,W,H)=>{
    // ── Base: deep space near-black with warm copper undertone ────────────
    const base = ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.78);
    base.addColorStop(0,   '#1a0d0a');
    base.addColorStop(0.35,'#120806');
    base.addColorStop(0.7, '#0d0604');
    base.addColorStop(1,   '#080302');
    ctx.fillStyle=base; ctx.fillRect(0,0,W,H);

    // ── Galaxy nebula clouds ───────────────────────────────────────────────
    const clouds = [
      {cx:0.28,cy:0.32,r:0.42,c0:'rgba(180,90,50,0.18)',c1:'rgba(0,0,0,0)'},
      {cx:0.72,cy:0.65,r:0.38,c0:'rgba(160,70,80,0.15)',c1:'rgba(0,0,0,0)'},
      {cx:0.5, cy:0.5, r:0.55,c0:'rgba(200,120,60,0.10)',c1:'rgba(0,0,0,0)'},
      {cx:0.15,cy:0.75,r:0.30,c0:'rgba(140,60,90,0.14)',c1:'rgba(0,0,0,0)'},
      {cx:0.85,cy:0.22,r:0.28,c0:'rgba(210,140,80,0.12)',c1:'rgba(0,0,0,0)'},
      {cx:0.62,cy:0.18,r:0.22,c0:'rgba(180,100,120,0.16)',c1:'rgba(0,0,0,0)'},
    ];
    clouds.forEach(({cx,cy,r,c0,c1})=>{
      const g=ctx.createRadialGradient(cx*W,cy*H,0,cx*W,cy*H,r*W);
      g.addColorStop(0,c0); g.addColorStop(1,c1);
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    });

    // ── Epoxy swirl veins — copper + rose gold ─────────────────────────────
    const swirlColors = [
      'rgba(200,130,70,VAL)',   // copper
      'rgba(212,145,158,VAL)',  // rose gold
      'rgba(230,160,90,VAL)',   // bright copper
      'rgba(190,110,130,VAL)',  // muted rose
      'rgba(245,195,120,VAL)',  // warm gold
      'rgba(160,80,60,VAL)',    // dark copper
      'rgba(220,170,140,VAL)',  // light bronze
    ];

    // Long flowing swirl strokes
    for(let i=0;i<60;i++){
      const col = swirlColors[i % swirlColors.length];
      const alpha = (0.04 + Math.sin(i*1.3)*0.03).toFixed(3);
      const strokeCol = col.replace('VAL', alpha);

      // Bezier swirl points
      const x0=Math.random()*W, y0=Math.random()*H;
      const cpx1=Math.random()*W, cpy1=Math.random()*H;
      const cpx2=Math.random()*W, cpy2=Math.random()*H;
      const x1=Math.random()*W,  y1=Math.random()*H;

      ctx.beginPath();
      ctx.moveTo(x0,y0);
      ctx.bezierCurveTo(cpx1,cpy1,cpx2,cpy2,x1,y1);
      ctx.strokeStyle=strokeCol;
      ctx.lineWidth = 1.5 + Math.random()*4.5;
      ctx.stroke();
    }

    // Thinner bright accent veins
    for(let i=0;i<40;i++){
      const col = swirlColors[i % swirlColors.length];
      const alpha = (0.06 + Math.random()*0.08).toFixed(3);
      const strokeCol = col.replace('VAL', alpha);
      const x0=Math.random()*W, y0=Math.random()*H;
      const cpx=Math.random()*W, cpy=Math.random()*H;
      const x1=Math.random()*W, y1=Math.random()*H;
      ctx.beginPath(); ctx.moveTo(x0,y0);
      ctx.quadraticCurveTo(cpx,cpy,x1,y1);
      ctx.strokeStyle=strokeCol;
      ctx.lineWidth = 0.5 + Math.random()*1.8;
      ctx.stroke();
    }

    // ── Glitter / galaxy stars ─────────────────────────────────────────────
    for(let i=0;i<1800;i++){
      const sx=Math.random()*W, sy=Math.random()*H;
      const sr=Math.random()*1.4;
      const brightness=Math.random();
      let starCol;
      if(brightness>0.85)      starCol=`rgba(255,240,220,${(0.5+Math.random()*0.5).toFixed(2)})`;
      else if(brightness>0.65) starCol=`rgba(220,160,100,${(0.3+Math.random()*0.4).toFixed(2)})`;
      else if(brightness>0.45) starCol=`rgba(200,130,150,${(0.2+Math.random()*0.35).toFixed(2)})`;
      else                     starCol=`rgba(180,110,80,${(0.1+Math.random()*0.2).toFixed(2)})`;
      ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2);
      ctx.fillStyle=starCol; ctx.fill();
    }

    // ── Bright copper + rose gold glitter specks ───────────────────────────
    for(let i=0;i<320;i++){
      const gx=Math.random()*W, gy=Math.random()*H;
      const gr=0.6+Math.random()*2.2;
      const g2=ctx.createRadialGradient(gx,gy,0,gx,gy,gr*3);
      if(Math.random()>0.5){
        g2.addColorStop(0,'rgba(245,185,100,0.9)');
        g2.addColorStop(0.4,'rgba(200,130,70,0.4)');
        g2.addColorStop(1,'rgba(180,100,50,0)');
      } else {
        g2.addColorStop(0,'rgba(230,170,175,0.85)');
        g2.addColorStop(0.4,'rgba(195,125,140,0.35)');
        g2.addColorStop(1,'rgba(160,90,110,0)');
      }
      ctx.fillStyle=g2;
      ctx.beginPath(); ctx.arc(gx,gy,gr*3,0,Math.PI*2); ctx.fill();
    }

    // ── Epoxy resin "cell" blobs — depth effect ───────────────────────────
    for(let i=0;i<18;i++){
      const bx=Math.random()*W, by=Math.random()*H;
      const br=30+Math.random()*120;
      const bg=ctx.createRadialGradient(bx,by,0,bx,by,br);
      const pick=Math.random();
      if(pick>0.66){
        bg.addColorStop(0,'rgba(200,130,70,0.07)');
        bg.addColorStop(0.5,'rgba(180,100,50,0.04)');
        bg.addColorStop(1,'rgba(0,0,0,0)');
      } else if(pick>0.33){
        bg.addColorStop(0,'rgba(212,145,158,0.07)');
        bg.addColorStop(0.5,'rgba(190,115,130,0.03)');
        bg.addColorStop(1,'rgba(0,0,0,0)');
      } else {
        bg.addColorStop(0,'rgba(245,195,120,0.06)');
        bg.addColorStop(0.5,'rgba(210,155,80,0.03)');
        bg.addColorStop(1,'rgba(0,0,0,0)');
      }
      ctx.fillStyle=bg;
      ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();
    }

    // ── Rose gold dado edge glow (floor perimeter) ────────────────────────
    const edgeGlow=ctx.createLinearGradient(0,0,0,H);
    edgeGlow.addColorStop(0,   'rgba(212,145,158,0.12)');
    edgeGlow.addColorStop(0.08,'rgba(212,145,158,0)');
    edgeGlow.addColorStop(0.92,'rgba(212,145,158,0)');
    edgeGlow.addColorStop(1,   'rgba(212,145,158,0.12)');
    ctx.fillStyle=edgeGlow; ctx.fillRect(0,0,W,H);
    const edgeGlow2=ctx.createLinearGradient(0,0,W,0);
    edgeGlow2.addColorStop(0,   'rgba(200,130,70,0.10)');
    edgeGlow2.addColorStop(0.06,'rgba(200,130,70,0)');
    edgeGlow2.addColorStop(0.94,'rgba(200,130,70,0)');
    edgeGlow2.addColorStop(1,   'rgba(200,130,70,0.10)');
    ctx.fillStyle=edgeGlow2; ctx.fillRect(0,0,W,H);

    // ── Final gloss overlay — epoxy wet-look sheen ────────────────────────
    const gloss=ctx.createRadialGradient(W*0.38,H*0.3,0,W*0.5,H*0.5,W*0.7);
    gloss.addColorStop(0,  'rgba(255,220,180,0.06)');
    gloss.addColorStop(0.4,'rgba(220,160,100,0.03)');
    gloss.addColorStop(1,  'rgba(0,0,0,0)');
    ctx.fillStyle=gloss; ctx.fillRect(0,0,W,H);
  });
}

function makeCeilTex(){
  return mkTex(2048,2048,(ctx,W,H)=>{
    ctx.fillStyle='#040202'; ctx.fillRect(0,0,W,H);
    // 4x4 coffered panels
    const cols=4,rows=4,cw=W/cols,ch=H/rows,cmg=cw*0.07;
    for(let cpx=0;cpx<cols;cpx++) for(let cpy=0;cpy<rows;cpy++){
      const x=cpx*cw+cmg,y=cpy*ch+cmg,w=cw-cmg*2,h=ch-cmg*2;
      // Recessed shadow
      const sdw=ctx.createRadialGradient(x+w/2,y+h/2,0,x+w/2,y+h/2,Math.max(w,h)*0.7);
      sdw.addColorStop(0,'rgba(0,0,0,0)'); sdw.addColorStop(1,'rgba(0,0,0,0.58)');
      ctx.fillStyle=sdw; ctx.fillRect(x,y,w,h);
      ctx.fillStyle='rgba(3,1,1,0.88)'; ctx.fillRect(x+4,y+4,w-8,h-8);
      ctx.strokeStyle='rgba(215,155,160,0.50)'; ctx.lineWidth=3.5; ctx.strokeRect(x,y,w,h);
      ctx.strokeStyle='rgba(183,110,121,0.18)'; ctx.lineWidth=1.5; ctx.strokeRect(x+16,y+16,w-32,h-32);
    }
    // LED strip glows along every rib — horizontal
    for(let r=0;r<=rows;r++){
      const gy=r*ch;
      const lg=ctx.createLinearGradient(0,gy-18,0,gy+18);
      lg.addColorStop(0,'rgba(0,0,0,0)'); lg.addColorStop(0.5,'rgba(255,195,145,0.22)'); lg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=lg; ctx.fillRect(0,gy-18,W,36);
      ctx.fillStyle='rgba(255,215,175,0.42)'; ctx.fillRect(0,gy-2,W,4);
    }
    // Vertical
    for(let c=0;c<=cols;c++){
      const gxx=c*cw;
      const lg2=ctx.createLinearGradient(gxx-18,0,gxx+18,0);
      lg2.addColorStop(0,'rgba(0,0,0,0)'); lg2.addColorStop(0.5,'rgba(255,195,145,0.22)'); lg2.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=lg2; ctx.fillRect(gxx-18,0,36,H);
      ctx.fillStyle='rgba(255,215,175,0.42)'; ctx.fillRect(gxx-2,0,4,H);
    }
    // Center medallion ring
    ctx.beginPath(); ctx.arc(W/2,H/2,130,0,Math.PI*2);

// ─── LOGO — BACK WALL ONLY ────────────────────────────────────────────────────
function makeLogoTex(){
  return mkTex(2400,800,(ctx,W,H)=>{
    ctx.clearRect(0,0,W,H);
    const cx=W/2;

    // ── Crosshair icon — metallic rose gold/copper, NO bloom on icon itself ──
    const iconX=cx-560, iconY=340, iconR=155;
    ctx.shadowBlur=0;

    // 3D metal circle — layered depth strokes
    for(let i=14;i>0;i--){
      ctx.strokeStyle=`rgba(60,20,25,${i/14*0.20})`; ctx.lineWidth=i*3;
      ctx.beginPath(); ctx.arc(iconX,iconY,iconR,0,Math.PI*2); ctx.stroke();
    }
    // Metallic gradient stroke — copper to rose gold
    const circG=ctx.createLinearGradient(iconX-iconR,iconY-iconR,iconX+iconR,iconY+iconR);
    circG.addColorStop(0,'#6b2e38');   // deep copper shadow
    circG.addColorStop(0.2,'#b87040'); // warm copper highlight
    circG.addColorStop(0.4,'#d4919e'); // rose gold
    circG.addColorStop(0.55,'#c8803a');// copper peak
    circG.addColorStop(0.75,'#e8b090');// light bronze
    circG.addColorStop(1,'#7a3840');   // shadow edge
    ctx.strokeStyle=circG; ctx.lineWidth=20; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(iconX,iconY,iconR,0,Math.PI*2); ctx.stroke();

    // Inner circle — subtle copper
    ctx.strokeStyle='rgba(180,110,55,0.55)'; ctx.lineWidth=8; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(iconX,iconY,iconR*0.62,0,Math.PI*2); ctx.stroke();

    // Crosshair lines — brushed copper
    const crossG=ctx.createLinearGradient(iconX-iconR,iconY,iconX+iconR,iconY);
    crossG.addColorStop(0,'rgba(180,100,40,0)');
    crossG.addColorStop(0.2,'#c87840');
    crossG.addColorStop(0.5,'#e8b490');
    crossG.addColorStop(0.8,'#c87840');
    crossG.addColorStop(1,'rgba(180,100,40,0)');
    ctx.strokeStyle=crossG; ctx.lineWidth=8; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.moveTo(iconX-iconR*1.05,iconY); ctx.lineTo(iconX+iconR*1.05,iconY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(iconX,iconY-iconR*1.05); ctx.lineTo(iconX,iconY+iconR*1.05); ctx.stroke();

    // Tick marks
    ctx.strokeStyle='rgba(200,135,65,0.75)'; ctx.lineWidth=5; ctx.shadowBlur=0;
    [-1,1].forEach(dir=>{
      [0.78,0.88].forEach(d=>{
        ctx.beginPath(); ctx.moveTo(iconX+iconR*d*dir,iconY-9); ctx.lineTo(iconX+iconR*d*dir,iconY+9); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(iconX-9,iconY+iconR*d*dir); ctx.lineTo(iconX+9,iconY+iconR*d*dir); ctx.stroke();
      });
    });

    // House silhouette — brushed copper/rose gold metal
    const hx=iconX, hy=iconY+18;
    // Shadow depth
    ctx.fillStyle='rgba(30,8,10,0.7)'; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.moveTo(hx-70,hy-40); ctx.lineTo(hx,hy-118); ctx.lineTo(hx+70,hy-40); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.rect(hx-52,hy-40,104,92); ctx.fill();
    // Roof — copper metallic
    const roofG=ctx.createLinearGradient(hx-65,hy-115,hx+65,hy-38);
    roofG.addColorStop(0,'#6b2e38'); roofG.addColorStop(0.3,'#c87840'); roofG.addColorStop(0.6,'#e8b490'); roofG.addColorStop(1,'#8a4830');
    ctx.fillStyle=roofG;
    ctx.beginPath(); ctx.moveTo(hx-68,hy-38); ctx.lineTo(hx,hy-115); ctx.lineTo(hx+68,hy-38); ctx.closePath(); ctx.fill();
    // Body — rose gold to copper
    const bodyG=ctx.createLinearGradient(hx-50,hy-38,hx+50,hy+50);
    bodyG.addColorStop(0,'#c87888'); bodyG.addColorStop(0.5,'#a05848'); bodyG.addColorStop(1,'#6a3030');
    ctx.fillStyle=bodyG;
    ctx.beginPath(); ctx.rect(hx-50,hy-38,100,90); ctx.fill();
    // Chimney
    const chimG=ctx.createLinearGradient(hx+18,hy-125,hx+40,hy-73);
    chimG.addColorStop(0,'#b87040'); chimG.addColorStop(1,'#7a3828');
    ctx.fillStyle=chimG; ctx.beginPath(); ctx.rect(hx+18,hy-125,22,52); ctx.fill();
    // Door
    ctx.fillStyle='rgba(5,2,2,0.92)';
    ctx.beginPath(); ctx.rect(hx-16,hy+18,32,34); ctx.fill();
    ctx.shadowBlur=0;

    // ── TRUESITE text — brushed metallic copper + rose gold, NO self-glow ───
    ctx.font='bold 185px Arial Black,Arial'; ctx.textBaseline='alphabetic';
    const tx=cx-100, ty=420;

    // 3D depth shadow layers — dark, pushed back
    for(let i=10;i>0;i--){
      ctx.fillStyle=`rgba(20,5,8,${0.32-i*0.025})`;
      ctx.fillText('TRUESITE',tx+i*2,ty+i*1.8);
    }

    // Metallic brushed copper/rose gold fill — NO shadowBlur
    const tg=ctx.createLinearGradient(tx,ty-250,tx,ty+10);
    tg.addColorStop(0,   '#4a1a20'); // deep shadow top edge
    tg.addColorStop(0.08,'#8a4035'); // dark copper
    tg.addColorStop(0.18,'#c87840'); // warm copper highlight
    tg.addColorStop(0.30,'#e8a870'); // bright copper/bronze

    tg.addColorStop(0.65,'#c06838'); // mid copper
    tg.addColorStop(0.80,'#a05040'); // deeper copper
    tg.addColorStop(1,   '#5a2828'); // shadow base
    ctx.shadowBlur=0; ctx.fillStyle=tg;
    ctx.fillText('TRUESITE',tx,ty);

    // Thin specular highlight stroke across top of letters
    const hiG=ctx.createLinearGradient(tx,ty-240,tx+1400,ty-240);
    hiG.addColorStop(0,'rgba(240,200,160,0)');
    hiG.addColorStop(0.15,'rgba(255,225,190,0.55)');
    hiG.addColorStop(0.5,'rgba(255,240,210,0.70)');
    hiG.addColorStop(0.85,'rgba(255,225,190,0.55)');
    hiG.addColorStop(1,'rgba(240,200,160,0)');
    ctx.strokeStyle=hiG; ctx.lineWidth=1.2; ctx.shadowBlur=0;
    ctx.strokeText('TRUESITE',tx,ty);

    // ── TECHNOLOGIES subtext — brushed metal, NO self-glow ──────────────
    ctx.font='700 74px Arial'; ctx.textBaseline='alphabetic';
    const subx=cx-98, suby=ty+80;

    // Depth layers
    for(let i=5;i>0;i--){
      ctx.fillStyle=`rgba(20,5,8,${0.25-i*0.03})`;
      ctx.fillText('TECHNOLOGIES',subx+i,suby+i);
    }
    const sg=ctx.createLinearGradient(subx,suby-90,subx,suby+8);
    sg.addColorStop(0,   '#6a3030');
    sg.addColorStop(0.2, '#b87040'); // copper
    sg.addColorStop(0.45,'#d4919e'); // rose gold
    sg.addColorStop(0.7, '#c06838'); // copper
    sg.addColorStop(1,   '#7a3828');
    ctx.shadowBlur=0; ctx.fillStyle=sg;
    ctx.fillText('TECHNOLOGIES',subx,suby);

    // Specular highlight on subtext
    ctx.strokeStyle='rgba(240,195,150,0.30)'; ctx.lineWidth=0.8; ctx.shadowBlur=0;
    ctx.strokeText('TECHNOLOGIES',subx,suby);

    // ── UNDERGLOW — soft rose gold/copper light FROM BEHIND, below logo ──
    // Wide soft halo behind the whole logo area
    const ugHalo=ctx.createRadialGradient(cx,H*0.75,0,cx,H*0.75,680);
    ugHalo.addColorStop(0,'rgba(200,120,80,0.28)');   // copper core
    ugHalo.addColorStop(0.3,'rgba(212,145,100,0.18)');// warm gold
    ugHalo.addColorStop(0.6,'rgba(190,105,120,0.10)');// rose hint
    ugHalo.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ugHalo; ctx.fillRect(0,0,W,H);

    // Horizontal bar glow behind text (simulate backlight strip)
    const ugBar=ctx.createLinearGradient(cx-800,0,cx+800,0);
    ugBar.addColorStop(0,  'rgba(180,95,60,0)');
    ugBar.addColorStop(0.15,'rgba(200,120,70,0.30)');
    ugBar.addColorStop(0.5, 'rgba(220,145,90,0.45)');
    ugBar.addColorStop(0.85,'rgba(200,120,70,0.30)');
    ugBar.addColorStop(1,  'rgba(180,95,60,0)');
    ctx.fillStyle=ugBar;
    ctx.fillRect(cx-800, H*0.18, 1600, H*0.72);

    // Bright underglow baseline strip — the "LED strip" behind the logo
    const stripG=ctx.createLinearGradient(cx-700,0,cx+700,0);
    stripG.addColorStop(0,  'rgba(212,145,100,0)');
    stripG.addColorStop(0.2,'rgba(230,155,100,0.75)');
    stripG.addColorStop(0.5,'rgba(245,185,120,0.95)');
    stripG.addColorStop(0.8,'rgba(230,155,100,0.75)');
    stripG.addColorStop(1,  'rgba(212,145,100,0)');
    ctx.fillStyle=stripG;
    ctx.fillRect(cx-700, H*0.82, 1400, 28);

    // Rose gold edge bloom strip above strip
    const roseStrip=ctx.createLinearGradient(cx-650,0,cx+650,0);
    roseStrip.addColorStop(0,  'rgba(212,145,158,0)');
    roseStrip.addColorStop(0.25,'rgba(212,145,158,0.60)');
    roseStrip.addColorStop(0.5, 'rgba(235,175,180,0.85)');
    roseStrip.addColorStop(0.75,'rgba(212,145,158,0.60)');
    roseStrip.addColorStop(1,  'rgba(212,145,158,0)');
    ctx.fillStyle=roseStrip;
    ctx.fillRect(cx-650, H*0.80, 1300, 14);

    // Bright thin line — the LED strip itself
    const ledLine=ctx.createLinearGradient(cx-580,0,cx+580,0);
    ledLine.addColorStop(0,'rgba(255,230,200,0)');
    ledLine.addColorStop(0.2,'rgba(255,220,180,0.95)');
    ledLine.addColorStop(0.5,'rgba(255,245,225,1.0)');
    ledLine.addColorStop(0.8,'rgba(255,220,180,0.95)');
    ledLine.addColorStop(1,'rgba(255,230,200,0)');
    ctx.strokeStyle=ledLine; ctx.lineWidth=3; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.moveTo(cx-580,H*0.85); ctx.lineTo(cx+580,H*0.85); ctx.stroke();
  });
}

// ── Logo image loader → CanvasTexture ────────────────────────────────────────
function makeLogoScreen(imgUrl, label, accentCol) {
  const W=640,H=400;
  const canvas=mkCanvas(W,H);
  const ctx=canvas.getContext('2d');
  // dark background
  ctx.fillStyle='#030202'; ctx.fillRect(0,0,W,H);
  // subtle grid
  ctx.strokeStyle='rgba(183,110,121,0.06)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // placeholder fill while image loads
  ctx.fillStyle=accentCol; ctx.font='bold 18px Courier New'; ctx.textAlign='center';
  ctx.fillText(label,W/2,H/2);
  const tex=new THREE.CanvasTexture(canvas);
  tex.colorSpace=THREE.SRGBColorSpace; tex.needsUpdate=true;
  // load image async and repaint
  const img=new Image(); img.crossOrigin='anonymous';
  img.onload=()=>{
    ctx.fillStyle='#030202'; ctx.fillRect(0,0,W,H);
    // subtle vignette
    const vg=ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
    // fit image centered
    const scale=Math.min((W*0.78)/img.width,(H*0.78)/img.height);
    const iw=img.width*scale,ih=img.height*scale;
    const ix=(W-iw)/2,iy=(H-ih)/2;
    ctx.drawImage(img,ix,iy,iw,ih);
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
    // label bar at bottom
    ctx.fillStyle='rgba(4,2,2,0.75)'; ctx.fillRect(0,H-36,W,36);
    ctx.strokeStyle=accentCol; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(0,H-36); ctx.lineTo(W,H-36); ctx.stroke();
    ctx.fillStyle=accentCol; ctx.font='bold 13px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor=accentCol; ctx.shadowBlur=8;
    ctx.fillText(label,W/2,H-18); ctx.shadowBlur=0;
    tex.needsUpdate=true;
  };
  img.onerror=()=>{
    ctx.fillStyle='rgba(255,50,50,0.5)'; ctx.font='12px Courier New'; ctx.textAlign='center';
    ctx.fillText('IMG LOAD ERR',W/2,H/2+20); tex.needsUpdate=true;
  };
  img.src=imgUrl;
  return tex;
}

// ── Video texture maker ───────────────────────────────────────────────────────
function makeVideoTex(url) {
  const vid=document.createElement('video');
  vid.src=url; vid.crossOrigin='anonymous';
  vid.loop=true; vid.muted=true; vid.playsInline=true;
  vid.autoplay=true;
  // Must be triggered after user gesture or autoplay policy — we attempt on load
  const tex=new THREE.VideoTexture(vid);
  tex.colorSpace=THREE.SRGBColorSpace;
  // Try to play; browsers may block until interaction
  vid.addEventListener('canplaythrough',()=>{ vid.play().catch(()=>{}); },{once:true});
  document.addEventListener('click',()=>{ vid.play().catch(()=>{});   _nitroBialVid.play().catch(()=>{});
},{once:true});
  return tex;
}

function drawKG(t){
  kgCtx.fillStyle='rgba(3,2,10,0.9)'; kgCtx.fillRect(0,0,KGW,KGH);
  kgCtx.strokeStyle='rgba(90,40,110,0.08)'; kgCtx.lineWidth=1;

  const pr=(Math.sin(t*2.2)*0.5+0.5)*50;
  kgCtx.strokeStyle=`rgba(212,145,158,${Math.max(0,0.28-pr/280)})`; kgCtx.lineWidth=2;
  kgCtx.beginPath(); kgCtx.arc(480,320,KG_NODES[0].r+pr,0,Math.PI*2); kgCtx.stroke();

    kgCtx.beginPath(); kgCtx.moveTo(na.x,na.y); kgCtx.lineTo(nb.x,nb.y); kgCtx.stroke();

  });
  KG_NODES.forEach((n,i)=>{

    kgCtx.fillStyle=n.col; kgCtx.beginPath(); kgCtx.arc(n.x,n.y,n.r*p,0,Math.PI*2); kgCtx.fill();

    kgCtx.font=`bold ${n.r<16?9:11}px Courier New`; kgCtx.textAlign='center'; kgCtx.textBaseline='middle';

}

function addScreen(tex,w,h,px,py,pz,ry){
  // Offset direction based on wall orientation so screen sits proud of wall
  const offX=Math.abs(ry)>0.1?(ry>0?0.06:-0.06):0;
  const offZ=Math.abs(ry)<0.1?0.06:0;
  // Screen plane — sits proud
  const s=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,toneMapped:false}));
  s.position.set(px+offX,py,pz+offZ); s.rotation.y=ry; scene.add(s);
  // bezel back — sits behind screen
  const bk=new THREE.Mesh(new THREE.BoxGeometry(w+0.22,h+0.22,0.09),darkMat(0x060202));
  bk.position.set(px,py,pz); bk.rotation.y=ry; scene.add(bk);
  // rose-gold bezel frame — surrounds
  const fr=new THREE.Mesh(new THREE.BoxGeometry(w+0.34,h+0.34,0.06),rgMat(0.4));
  fr.position.set(px,py,pz); fr.rotation.y=ry; scene.add(fr);
  // glow
  const ox=Math.abs(ry)>0.1?(ry>0?1.2:-1.2):0, oz=Math.abs(ry)<0.1?1.2:0;
  const gl=new THREE.PointLight(0x88aacc,0.7,9);
  gl.position.set(px+ox,py,pz+oz); scene.add(gl);
  return s;
}

function drawFOL(t){
  if(t-lastFOL<0.055)return; lastFOL=t;
  const S=512,C=256; folCtx.clearRect(0,0,S,S);
  const{r,g,b}=getColor(t); const d=1/PHI;
  const c1=`rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},0.55)`;
  const c2=`rgba(${Math.round(r*d)},${Math.round(g*d)},${Math.round(b*d)},0.3)`;
  const R=44;
  function fc(x,y,r2,col,lw){folCtx.beginPath();folCtx.arc(x,y,r2,0,Math.PI*2);folCtx.strokeStyle=col;folCtx.lineWidth=lw;folCtx.stroke();}
  fc(C,C,R,c1,1.6);
  for(let i=0;i<6;i++){const a=i*Math.PI/3;fc(C+Math.cos(a)*R,C+Math.sin(a)*R,R,c1,1.3);}
  for(let i=0;i<6;i++){const a=i*Math.PI/3;fc(C+Math.cos(a)*2*R,C+Math.sin(a)*2*R,R,c2,1.0);fc(C+Math.cos(a+Math.PI/6)*R*Math.sqrt(3),C+Math.sin(a+Math.PI/6)*R*Math.sqrt(3),R,c2,0.8);}
  folTex.needsUpdate=true;
}

  const sx=Math.cos(rad)*5.85, sz=Math.sin(rad)*5.85;
  const grp=new THREE.Group();
  grp.position.set(sx,TABLE_Y,sz);
  grp.rotation.y=rad+Math.PI;
  grp.userData={member:m, ph:i*0.72};
  // ── Sculpted executive chair ─────────────────────────────────────────────
  const LEATHER = new THREE.MeshStandardMaterial({
    color:0x0d0808, roughness:0.55, metalness:0.05,
    envMapIntensity:1.2
  });
  const CHROME = new THREE.MeshStandardMaterial({
    color:0x888888, roughness:0.08, metalness:1.0
  });
  const CHROME_DARK = new THREE.MeshStandardMaterial({
    color:0x444444, roughness:0.12, metalness:0.95
  });

  // — SEAT CUSHION (sculpted cylinder, tapered edge) —
  const seatGeo = new THREE.CylinderGeometry(0.41, 0.38, 0.11, 32, 1);
  // push top verts up slightly in center for cushion bulge
  const sPos = seatGeo.attributes.position;
  for(let vi=0;vi<sPos.count;vi++){
    const y=sPos.getY(vi), r=Math.sqrt(sPos.getX(vi)**2+sPos.getZ(vi)**2);
    if(y>0.04) sPos.setY(vi, y + 0.04*(1-r/0.42));
  }
  seatGeo.computeVertexNormals();
  const seat = new THREE.Mesh(seatGeo, LEATHER.clone());
  seat.position.set(0, 0.06, 0); seat.castShadow=true; grp.add(seat);

  // — BACKREST (lathe profile — wide executive high-back) —
  const backPoints=[];
  // bottom to top half-profile (x=width, y=height)
  [[-0.36,0],[-0.38,0.05],[-0.39,0.3],[-0.38,0.55],[-0.36,0.75],
   [-0.33,0.88],[-0.28,0.96],[-0.20,1.00],[-0.10,1.01],[0,1.01]
  ].forEach(([x,y])=>backPoints.push(new THREE.Vector2(x+0.39,y)));
  // Build backrest as an extruded shape (not lathe — lathe is round)
  // Use BoxGeometry shaped mesh + displacement — but better: use ShapeGeometry
  // Backrest: CylinderGeometry (very flat, wide) oriented vertically, 
  // then a curved top using a torus segment at the top
  
  // SIMPLER ACCURATE APPROACH: build from multiple tapered cylinders + rounded top
  // Back panel — tall padded slab
  const backSlab = new THREE.Mesh(
    new THREE.BoxGeometry(0.74, 0.92, 0.10),
    LEATHER.clone()
  );
  backSlab.position.set(0, 0.62, -0.36);
  backSlab.castShadow=true; grp.add(backSlab);

  // Back top rounded cap (half-torus gives that premium high-back curved top)
  const backTop = new THREE.Mesh(
    new THREE.CylinderGeometry(0.37, 0.37, 0.10, 32, 1, false, 0, Math.PI),
    LEATHER.clone()
  );
  backTop.rotation.z = Math.PI / 2; // stand the half-cylinder on its side
  backTop.position.set(0, 1.09, -0.36);
  backTop.castShadow=true; grp.add(backTop);

  // Lumbar cushion bump
  const lumbar = new THREE.Mesh(
    new THREE.SphereGeometry(0.32, 20, 10, 0, Math.PI),
    LEATHER.clone()
  );
  lumbar.rotation.x = -Math.PI/2;
  lumbar.scale.set(1.0, 0.065, 0.22);
  lumbar.position.set(0, 0.34, -0.31);
  grp.add(lumbar);

  // — CHROME BACK FRAME (spine behind backrest) —
  const spineGeo = new THREE.CylinderGeometry(0.022, 0.022, 1.05, 12);
  const spineL = new THREE.Mesh(spineGeo, CHROME_DARK.clone());
  const spineR = new THREE.Mesh(spineGeo, CHROME_DARK.clone());
  spineL.position.set(-0.32, 0.58, -0.34); spineL.castShadow=true; grp.add(spineL);
  spineR.position.set( 0.32, 0.58, -0.34); spineR.castShadow=true; grp.add(spineR);

  // Spine cross-bar
  const crossBar = new THREE.Mesh(
    new THREE.CylinderGeometry(0.016,0.016,0.66,10),
    CHROME_DARK.clone()
  );
  crossBar.rotation.z = Math.PI/2;
  crossBar.position.set(0, 0.14, -0.34); grp.add(crossBar);

  // — ARMRESTS (padded, chrome pillar) —
  [-0.42, 0.42].forEach(ax=>{
    // chrome pillar up from seat
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.24,10), CHROME.clone());
    pillar.position.set(ax, 0.23, -0.05); grp.add(pillar);
    // padded rest surface
    const rest = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.055, 0.38), LEATHER.clone());
    rest.position.set(ax, 0.37, -0.05); rest.castShadow=true; grp.add(rest);
    // rounded ends on rest
    [0.19,-0.19].forEach(rz=>{
      const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.047,0.047,0.055,16),LEATHER.clone());
      cap.rotation.z=0; cap.position.set(ax,0.37,rz); grp.add(cap);
    });
  });

  // — PNEUMATIC COLUMN —
  const gasLift = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.065,0.52,16), CHROME.clone());
  gasLift.position.set(0,-0.28,0); grp.add(gasLift);
  // Gas lift bellows ring
  const bellows = new THREE.Mesh(new THREE.TorusGeometry(0.062,0.016,8,20), CHROME_DARK.clone());
  bellows.position.set(0,-0.08,0); bellows.rotation.x=Math.PI/2; grp.add(bellows);

  // — 5-STAR BASE —
  const BASE_MAT = CHROME_DARK.clone();
  for(let si=0;si<5;si++){
    const ang = (si/5)*Math.PI*2;
    const armLen=0.52;
    // arm
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.035,armLen,10), BASE_MAT.clone());
    arm.rotation.z = Math.PI/2;
    arm.rotation.y = ang;
    arm.position.set(Math.cos(ang)*armLen*0.5, -0.58, Math.sin(ang)*armLen*0.5);
    grp.add(arm);
    // caster wheel
    const caster = new THREE.Mesh(new THREE.TorusGeometry(0.045,0.018,8,16), BASE_MAT.clone());
    caster.position.set(Math.cos(ang)*armLen, -0.55, Math.sin(ang)*armLen);
    caster.rotation.y = ang + Math.PI/2;
    grp.add(caster);
  }
  // center hub
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.068,0.072,0.055,20), CHROME.clone());
  hub.position.set(0,-0.555,0); grp.add(hub);
  // globe
  const isPhi=m.isMarz||m.color==='orig';
  const gc1=mkCanvas(768,768), gc2=mkCanvas(768,768);
  const gx1=gc1.getContext('2d'), gx2=gc2.getContext('2d');
  if(isPhi){
    paintRing(gx1,768,768,'rgba(255,195,120,0.95)');
    paintRing(gx2,768,768,'rgba(210,160,100,0.82)');
  } else {
    const hex=m.color.replace('#','');
    const cr=parseInt(hex.slice(0,2),16),cg=parseInt(hex.slice(2,4),16),cb=parseInt(hex.slice(4,6),16);
    const d=1/PHI;
    paintRing(gx1,768,768,`rgba(${cr},${cg},${cb},0.95)`);
    paintRing(gx2,768,768,`rgba(${Math.round(cr*d)},${Math.round(cg*d)},${Math.round(cb*d)},0.82)`);
  }
  const gt1=new THREE.CanvasTexture(gc1), gt2=new THREE.CanvasTexture(gc2);
  const gs=m.isMarz?0.46:0.35;
  const globe=makeGlobe(gs,gt1,gt2);
  globe.position.set(0,1.90,-0.08);
  globe.userData.isPhi=isPhi; globe.userData.cwCtx=gx1; globe.userData.ccwCtx=gx2; globe.userData.cwTex=gt1; globe.userData.ccwTex=gt2;
  grp.userData.globe=globe; grp.add(globe);
  // pulse ring
  const pCol=m.isMarz?0xFFD700:(m.color==='orig'?0xc8960c:parseInt((m.color||'#c8960c').slice(1),16));
  if(m.online){
    const pulse=new THREE.Mesh(new THREE.TorusGeometry(gs+0.1,0.02,10,48),new THREE.MeshBasicMaterial({color:pCol,transparent:true,opacity:0.65}));
    pulse.rotation.x=Math.PI/2; pulse.position.set(0,1.50,-0.08);
    grp.userData.pulse=pulse; grp.add(pulse);
  }
  // crown (Marz)
  if(m.isMarz){
    const crown=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.038,10,40),new THREE.MeshStandardMaterial({color:0xFFD700,roughness:0.08,metalness:1.0,emissive:0x886600,emissiveIntensity:1.1}));
    crown.rotation.x=Math.PI/2; crown.position.set(0,2.30,-0.08);
    grp.userData.crown=crown; grp.add(crown);
  }
  // label sprite
  const lc=mkCanvas(300,90); const lx=lc.getContext('2d');
  const lCol=m.isMarz?'#FFD700':(m.color==='orig'?'#c8960c':(m.color||'#d4919e'));
  lx.fillStyle='rgba(4,2,2,0.92)'; lx.beginPath(); lx.roundRect(3,3,294,84,11); lx.fill();
  lx.strokeStyle=lCol; lx.lineWidth=2; lx.beginPath(); lx.roundRect(3,3,294,84,11); lx.stroke();
  lx.fillStyle=lCol; lx.font='bold 20px Courier New'; lx.textAlign='center'; lx.fillText(m.name,150,28);
  lx.fillStyle='#666'; lx.font='13px Arial'; lx.fillText(m.role,150,48);
  lx.fillStyle=m.online?'#22c55e':'#444'; lx.beginPath(); lx.arc(136,68,5,0,Math.PI*2); lx.fill();
  lx.fillStyle=m.online?'#22c55e':'#555'; lx.font='bold 11px Arial'; lx.textAlign='left'; lx.fillText(m.online?'ONLINE':'OFFLINE',148,72);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(lc),transparent:true}));
  spr.scale.set(1.55,0.465,1); spr.position.set(0,2.70,-0.08);
  grp.userData.sprite=spr; grp.add(spr);
  // hit box
  const hit=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,2.5,12),new THREE.MeshBasicMaterial({visible:false}));
  hit.position.set(0,1.25,-0.08); hit.userData={member:m}; grp.add(hit); grp.userData.hit=hit;
  scene.add(grp); seats.push(grp);
});

// ─── CAMERA CONTROL ──────────────────────────────────────────────────────────
const mouse=new THREE.Vector2();
let isDrag=false, px0=0, py0=0, rotY=0, rotX=-0.22, zoom=13;
canvas.addEventListener('mousedown',e=>{isDrag=false;px0=e.clientX;py0=e.clientY;});
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  if(e.buttons===1){
    const dx=e.clientX-px0,dy=e.clientY-py0;
    if(Math.abs(dx)>1.5||Math.abs(dy)>1.5){isDrag=true;rotY+=dx*0.006;rotX=Math.max(-0.82,Math.min(0.18,rotX+dy*0.004));px0=e.clientX;py0=e.clientY;}
  }
});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(5.5,Math.min(25,zoom+e.deltaY*0.014));},{passive:false});
const ray=new THREE.Raycaster();
canvas.addEventListener('click',e=>{
  if(isDrag)return;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(seats.map(s=>s.userData.hit));
  if(!hits.length)return;
  const m=hits[0].object.userData.member;
  const el=document.getElementById('info');
  el.textContent=m.isMarz?'👑 Marz — Head of the Table':`↗ ${m.name} · ${m.role}`;
  el.style.opacity='1'; setTimeout(()=>el.style.opacity='0',3000);
});

// ─── ANIMATE LOOP ─────────────────────────────────────────────────────────────
const clock=new THREE.Clock();
let lastColorUpdate=-1;
renderer.setAnimationLoop(()=>{
  if(window._nitroBialUpdate) window._nitroBialUpdate();
  const t=clock.getElapsedTime();
  // camera orbit
  const cx=Math.sin(rotY)*zoom*Math.cos(rotX);
  const cz=Math.cos(rotY)*zoom*Math.cos(rotX);
  const cy=zoom*Math.sin(-rotX)+1.5;
  camera.position.set(cx,cy,cz); camera.lookAt(0,1.5,0);
  drawFOL(t); drawKG(t);
  // color update — throttled to 20fps
  if(t-lastColorUpdate>0.05){
    lastColorUpdate=t;
    const{r,g,b}=getColor(t); const d=1/PHI;
    const cwCSS=`rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},0.95)`;
    const ccwCSS=`rgba(${Math.round(r*d)},${Math.round(g*d)},${Math.round(b*d)},0.82)`;
    paintRing(srcCWCtx,512,512,cwCSS); srcTexCW.needsUpdate=true;
    paintRing(srcCCWCtx,512,512,ccwCSS); srcTexCCW.needsUpdate=true;
    srcLight.color.setRGB(r/255,g/255,b/255);
    // update phi-cycle sibling globes
    seats.forEach(s=>{
      const g2=s.userData.globe;
      if(!g2||!g2.userData.isPhi)return;
      paintRing(g2.userData.cwCtx,512,512,cwCSS); g2.userData.cwTex.needsUpdate=true;
      paintRing(g2.userData.ccwCtx,512,512,ccwCSS); g2.userData.ccwTex.needsUpdate=true;
    });
  }
  // source globe
  sourceGlobe.position.y=3.6+0.12*Math.sin(t*0.6);
  sourceGlobe.rotation.y=t*0.18;
  animGlobe(sourceGlobe,t);
  // seats
  seats.forEach(s=>{
    const ph=s.userData.ph, bob=0.05*Math.sin(t*1.15+ph);
    const globe=s.userData.globe;
    if(globe){animGlobe(globe,t); globe.position.y=1.72+bob;}
    const pulse=s.userData.pulse;
    if(pulse){const sc=1+0.18*Math.sin(t*1.9+ph);pulse.scale.setScalar(sc);pulse.material.opacity=0.28+0.38*Math.sin(t*1.9+ph);}
    if(s.userData.sprite)s.userData.sprite.position.y=2.52+bob;
    if(s.userData.crown){s.userData.crown.rotation.z=t*0.5;s.userData.crown.position.y=2.1+bob;}
  });
  // hover tooltip
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(seats.map(s=>s.userData.hit));
  const tip=document.getElementById('tooltip');
  if(hits.length){
    const m=hits[0].object.userData.member;
    tip.textContent=m.isMarz?'👑 Marz — Head of the Table':`Click to engage · ${m.name} · ${m.role}`;
    tip.style.opacity='1'; canvas.style.cursor='pointer';
  } else {
    tip.style.opacity='0'; canvas.style.cursor='grab';
  }
  composer.render();
});
</script>
</body>
