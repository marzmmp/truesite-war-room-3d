<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.165.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

// --- - / SACRED ---------------------------------------------------------------
const PHI = 1.6180339887498948482;
const SACRED = [3,5,6,5,3,6,9,9,6,3];

// --- COLOR SYSTEM (exact fol_globe_v4 logic) ---------------------------------
const PHI_STOPS = [];
for(let i=0;i<8;i++){
  const hue=((i*360*(1-1/PHI))%360)/360, s=(1/PHI), l=0.55+(i%3)*(PHI-1)*0.06;
  const q=l<0.5?l*(1+s):l+s-l*s, p=2*l-q;
  const h2=(x)=>{x=((x%1)+1)%1;if(x<1/6)return p+(q-p)*6*x;if(x<.5)return q;if(x<2/3)return p+(q-p)*(2/3-x)*6;return p;};
  PHI_STOPS.push({r:Math.round(h2(hue+1/3)*255),g:Math.round(h2(hue)*255),b:Math.round(h2(hue-1/3)*255)});
}
const FIB=[1,1,2,3,5,8,5,3], HOLD=2.0, BLEND=2.5;
const CYCLE_T = FIB.reduce((a,f)=>a+f*HOLD+BLEND,0);
const STARTS=[]; let _s=0; for(let i=0;i<8;i++){STARTS.push(_s);_s+=FIB[i]*HOLD+BLEND;}
function getColor(t){
  const m=t%CYCLE_T; let idx=0;
  for(let i=7;i>=0;i--){if(m>=STARTS[i]){idx=i;break;}}
  const nx=(idx+1)%8, el=m-STARTS[idx], hd=FIB[idx]*HOLD;
  if(el<=hd)return{...PHI_STOPS[idx]};
  const e=(el-hd)/BLEND, ease=e*e*(3-2*e), a=PHI_STOPS[idx], b=PHI_STOPS[nx];
  return{r:a.r+(b.r-a.r)*ease, g:a.g+(b.g-a.g)*ease, b:a.b+(b.b-a.b)*ease};
}

// --- CANVAS HELPER ------------------------------------------------------------
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function mkTex(w,h,draw){const c=mkCanvas(w,h);draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.needsUpdate=true;return t;}

// --- SACRED CIRCLE PAINTER ----------------------------------------------------
function paintRing(ctx,w,h,css){
  ctx.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2;
  // Scale font proportionally to canvas size (base was 11px at 512px)
  const scale=w/512;
  const fs=Math.round(11*scale), cw=fs*0.62;
  const r=Math.min(w,h)*0.42;
  const total=Math.floor((2*Math.PI*r)/cw);
  ctx.font=`bold ${fs}px Courier New`;
  ctx.textAlign='center'; ctx.textBaseline='middle';

  // Multi-pass for crisp glow — outer glow, then sharp core
  const cssBase=css.replace(/[\d.]+\)$/,'');
  const alpha=parseFloat((css.match(/[\d.]+\)$/)||['1)'])[0]);

  // Glow pass
  ctx.shadowColor=css;
  ctx.shadowBlur=fs*1.4*scale;
  ctx.fillStyle=css.replace(/[\d.]+\)$/, (alpha*0.35).toFixed(3)+')');
  for(let i=0;i<total;i++){
    const a=(i/total)*Math.PI*2;
    ctx.save();ctx.translate(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.rotate(a+Math.PI/2);
    ctx.fillText(String(SACRED[i%10]),0,0);ctx.restore();
  }
  // Sharp core pass
  ctx.shadowBlur=fs*0.5*scale;
  ctx.fillStyle=css;
  for(let i=0;i<total;i++){
    const a=(i/total)*Math.PI*2;
    ctx.save();ctx.translate(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.rotate(a+Math.PI/2);
    ctx.fillText(String(SACRED[i%10]),0,0);ctx.restore();
  }
  ctx.shadowBlur=0;
}

// --- GLOBE BUILDER ------------------------------------------------------------
function makeGlobe(scale, cwTex, ccwTex){
  const group = new THREE.Group();
  const N=256, PHI_SQ=Math.PI*(3-Math.sqrt(5)), meshes=[];
  // Slightly larger petals fill the sphere surface more densely
  const geo = new THREE.PlaneGeometry(2*Math.sin(0.4)*1.08, 2*Math.sin(0.4)*1.08);
  for(let i=0;i<N;i++){
    const y=1-(i/(N-1))*2, r2=Math.sqrt(Math.max(0,1-y*y)), theta=PHI_SQ*i;
    const pole=new THREE.Vector3(r2*Math.cos(theta),y,r2*Math.sin(theta)).normalize();
    const isCW=i%2===0;
    const mat=new THREE.MeshStandardMaterial({
      map:isCW?cwTex:ccwTex,
      emissiveMap:isCW?cwTex:ccwTex,
      emissive:new THREE.Color(1,1,1),
      emissiveIntensity:0.55,
      transparent:true, opacity:0.80,
      blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide,
      roughness:0.0, metalness:0.0, toneMapped:false
    });
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.copy(pole.clone().multiplyScalar(0.01));
    const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),pole);
    mesh.quaternion.copy(q);
    const pm=(PHI*(i+1))%1;
    mesh.userData={pole,isCW,baseQ:q.clone(),spd:0.01+pm*0.008,ph:(PHI*i*2.3)%(Math.PI*2),sf:0.4+pm*1.2};
    group.add(mesh); meshes.push(mesh);
  }
  group.scale.setScalar(scale);
  group.userData={meshes};
  return group;
}
function animGlobe(group, t){
  const ax=new THREE.Vector3(), qs=new THREE.Quaternion(), qb=new THREE.Quaternion();
  group.userData.meshes.forEach(m=>{
    const{pole,isCW,baseQ,spd,ph,sf}=m.userData;
    m.material.opacity=0.70+0.22*(Math.sin(t*sf+ph)*0.5+0.5);
    m.material.emissiveIntensity=0.45+0.25*(Math.sin(t*sf*1.3+ph)*0.5+0.5);
    ax.copy(pole); qs.setFromAxisAngle(ax,t*(isCW?spd:-spd));
    m.quaternion.copy(qb.copy(baseQ).premultiply(qs));
  });
}

// --- SCENE SETUP --------------------------------------------------------------
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance',logarithmicDepthBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,3));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.physicallyCorrectLights = true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.72;
renderer.outputColorSpace=THREE.SRGBColorSpace;

// -- High-quality environment lighting for metallic surfaces ------------------
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x040202);
scene.fog=new THREE.FogExp2(0x000000,0.010);

const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new RoomEnvironment();
scene.environment = pmrem.fromScene(envScene).texture;
scene.environment.colorSpace = THREE.SRGBColorSpace;
pmrem.dispose();

const camera=new THREE.PerspectiveCamera(48,1,0.05,200);
camera.position.set(0,4.5,13);

// Post-processing
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),0.55,0.35,0.72));

function onResize(){
  const W=window.innerWidth,H=window.innerHeight;
  renderer.setSize(W,H); composer.setSize(W,H);
  camera.aspect=W/H; camera.updateProjectionMatrix();
}
onResize(); window.addEventListener('resize',onResize);

// --- MATERIALS ----------------------------------------------------------------
const RG={main:0xd4919e, dark:0xb86070, emissive:0x5a1822};
function rgMat(ei=0.5){return new THREE.MeshStandardMaterial({color:RG.main,roughness:0.18,metalness:0.95,emissive:RG.emissive,emissiveIntensity:ei});}
function darkMat(col=0x0a0505){return new THREE.MeshStandardMaterial({color:col,roughness:0.82,metalness:0.15});}

// Wall texture - black panels with rose-gold dado
function makeWallTex(W=4096,H=2048,pcols=5,prows=2){
  return mkTex(W,H,(ctx)=>{
    // Deep black lacquer base
    const baseG=ctx.createLinearGradient(0,0,W,H);
    baseG.addColorStop(0,'#000000'); baseG.addColorStop(0.5,'#000000'); baseG.addColorStop(1,'#000000');
    ctx.fillStyle=baseG; ctx.fillRect(0,0,W,H);
    // Micro grain - leather/lacquer feel
    for(let i=0;i<8000;i++){
      const a=(Math.random()*0.04).toFixed(3);
      ctx.fillStyle=`rgba(10,10,10,${a})`; ctx.fillRect(Math.random()*W,Math.random()*H,1,Math.random()>0.6?2:1);
    }
    // Deep recessed panels with rose-gold metallic bevel
    const pw=W/pcols,ph=H/prows,mg=pw*0.06;
    for(let px=0;px<pcols;px++) for(let py=0;py<prows;py++){
      const x=px*pw+mg,y=py*ph+mg,w=pw-mg*2,h=ph-mg*2;
      // Panel shadow depth
      const sdw=ctx.createLinearGradient(x,y,x+w,y+h);
      sdw.addColorStop(0,'rgba(0,0,0,0.70)'); sdw.addColorStop(0.5,'rgba(0,0,0,0.30)'); sdw.addColorStop(1,'rgba(0,0,0,0.60)');
      ctx.fillStyle=sdw; ctx.fillRect(x,y,w,h);
      // Outer rose-gold bevel
      ctx.strokeStyle='rgba(212,150,155,0.55)'; ctx.lineWidth=2.5; ctx.strokeRect(x,y,w,h);
      // Inner inset
      ctx.strokeStyle='rgba(183,110,121,0.15)'; ctx.lineWidth=1; ctx.strokeRect(x+9,y+9,w-18,h-18);
      // Metallic sheen
      const sheen=ctx.createLinearGradient(x,y,x,y+h);
      sheen.addColorStop(0,'rgba(255,255,255,0.025)'); sheen.addColorStop(1,'rgba(200,200,200,0.008)');
      ctx.fillStyle=sheen; ctx.fillRect(x+2,y+2,w-4,h-4);
    }
    // Dado rail - brushed rose-gold metallic band
    const d=H*0.38;
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,d+18,W,10);
    const railG=ctx.createLinearGradient(0,d,0,d+18);
    railG.addColorStop(0,'rgba(255,200,160,0.92)');
    railG.addColorStop(0.25,'rgba(225,160,130,0.95)');
    railG.addColorStop(0.65,'rgba(200,130,110,0.9)');
    railG.addColorStop(1,'rgba(170,100,85,0.8)');
    ctx.fillStyle=railG; ctx.fillRect(0,d,W,18);
    // Shine + shadow lines
    ctx.fillStyle='rgba(255,235,205,0.78)'; ctx.fillRect(0,d,W,2.5);
    ctx.fillStyle='rgba(90,40,30,0.85)'; ctx.fillRect(0,d+16,W,2);
    // Wainscot ribs below dado
    const ribCount=pcols*2+1, ribW=W/ribCount;
    for(let r=0;r<ribCount;r++){
      const rx=r*ribW;
      ctx.fillStyle='rgba(183,110,121,0.16)'; ctx.fillRect(rx,d+18,1.5,H-(d+18));
    }
    // Crown glow at top
    const crownG=ctx.createLinearGradient(0,0,0,32);
    crownG.addColorStop(0,'rgba(245,185,150,0.18)'); crownG.addColorStop(1,'rgba(183,110,121,0)');
    ctx.fillStyle=crownG; ctx.fillRect(0,0,W,32);
  });
}
function makeFloorTex(){
  return mkTex(8192,8192,(ctx,W,H)=>{

    // Pure pitch black
    ctx.fillStyle='#000000';
    ctx.fillRect(0,0,W,H);

    // ── Faint background stars — tiny dim points ──
    for(let i=0;i<4000;i++){
      const sx=Math.random()*W, sy=Math.random()*H;
      const sr=Math.random()*0.8;
      const b=Math.random();
      let sc;
      if(b>0.93)      sc=`rgba(255,255,255,${(0.6+Math.random()*0.4).toFixed(2)})`;
      else if(b>0.82) sc=`rgba(210,230,255,${(0.35+Math.random()*0.35).toFixed(2)})`;
      else if(b>0.68) sc=`rgba(255,240,200,${(0.22+Math.random()*0.28).toFixed(2)})`;
      else if(b>0.52) sc=`rgba(180,200,255,${(0.12+Math.random()*0.18).toFixed(2)})`;
      else            sc=`rgba(200,200,220,${(0.04+Math.random()*0.09).toFixed(2)})`;
      ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2);
      ctx.fillStyle=sc; ctx.fill();
    }

    // ── Bright stars with glow halos ──
    for(let i=0;i<200;i++){
      const sx=Math.random()*W, sy=Math.random()*H;
      const sr=1.0+Math.random()*3.0;
      const halo=ctx.createRadialGradient(sx,sy,0,sx,sy,sr*6);
      const pick=Math.random();
      let hc;
      if(pick>0.65) hc='rgba(200,220,255,';
      else if(pick>0.35) hc='rgba(255,245,200,';
      else hc='rgba(255,200,150,';
      halo.addColorStop(0,   hc+'0.85)');
      halo.addColorStop(0.25,hc+'0.30)');
      halo.addColorStop(0.6, hc+'0.08)');
      halo.addColorStop(1,   hc+'0)');
      ctx.fillStyle=halo;
      ctx.beginPath(); ctx.arc(sx,sy,sr*6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.98)';
      ctx.beginPath(); ctx.arc(sx,sy,sr*0.4,0,Math.PI*2); ctx.fill();
    }

    // ── 4-point star glints ──
    for(let i=0;i<100;i++){
      const gx=Math.random()*W, gy=Math.random()*H;
      const gl=5+Math.random()*22;
      const ga=0.45+Math.random()*0.50;
      const pick=Math.random();
      let gc;
      if(pick>0.6) gc='rgba(255,255,255,';
      else if(pick>0.3) gc='rgba(200,230,255,';
      else gc='rgba(255,235,160,';
      ctx.save();
      ctx.globalAlpha=ga;
      ctx.strokeStyle=gc+'0.95)'; ctx.lineWidth=1.0;
      ctx.beginPath(); ctx.moveTo(gx-gl,gy); ctx.lineTo(gx+gl,gy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx,gy-gl); ctx.lineTo(gx,gy+gl); ctx.stroke();
      ctx.globalAlpha=ga*0.3; ctx.lineWidth=0.5;
      ctx.beginPath(); ctx.moveTo(gx-gl*0.6,gy-gl*0.6); ctx.lineTo(gx+gl*0.6,gy+gl*0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx+gl*0.6,gy-gl*0.6); ctx.lineTo(gx-gl*0.6,gy+gl*0.6); ctx.stroke();
      ctx.restore();
    }

    // ── Hebrew Sacred Names — יהוה + יהושע glowing like stars ──
    const YAHUAH  = '\u05D9\u05D4\u05D5\u05D4';
    const YAHUSHA = '\u05D9\u05D4\u05D5\u05E9\u05E2';

    // [x, y, text, size, alpha, letterColor, glowColor]
    const names=[
      [0.10, 0.08, YAHUAH,  130, 0.80, 'rgba(255,255,200,A)', 'rgba(255,245,120,A)'],
      [0.58, 0.06, YAHUSHA, 105, 0.72, 'rgba(180,220,255,A)', 'rgba(80,170,255,A)'],
      [0.84, 0.16, YAHUAH,   88, 0.60, 'rgba(255,190,255,A)', 'rgba(200,80,255,A)'],
      [0.06, 0.38, YAHUSHA, 110, 0.70, 'rgba(150,255,210,A)', 'rgba(30,200,140,A)'],
      [0.40, 0.25, YAHUAH,   82, 0.55, 'rgba(255,235,150,A)', 'rgba(255,190,30,A)'],
      [0.74, 0.30, YAHUSHA,  95, 0.65, 'rgba(190,200,255,A)', 'rgba(100,110,255,A)'],
      [0.22, 0.55, YAHUAH,  108, 0.75, 'rgba(255,225,180,A)', 'rgba(255,155,60,A)'],
      [0.66, 0.52, YAHUSHA,  78, 0.50, 'rgba(160,255,230,A)', 'rgba(20,220,180,A)'],
      [0.91, 0.50, YAHUAH,   88, 0.58, 'rgba(230,185,255,A)', 'rgba(170,50,230,A)'],
      [0.14, 0.73, YAHUSHA, 102, 0.68, 'rgba(190,230,255,A)', 'rgba(70,155,240,A)'],
      [0.50, 0.70, YAHUAH,  118, 0.78, 'rgba(255,255,205,A)', 'rgba(255,248,110,A)'],
      [0.78, 0.74, YAHUSHA,  86, 0.55, 'rgba(230,155,255,A)', 'rgba(155,30,225,A)'],
      [0.30, 0.88, YAHUAH,   80, 0.52, 'rgba(175,220,255,A)', 'rgba(70,155,255,A)'],
      [0.64, 0.90, YAHUSHA, 100, 0.70, 'rgba(255,215,180,A)', 'rgba(255,140,70,A)'],
      [0.90, 0.86, YAHUAH,   74, 0.45, 'rgba(205,248,195,A)', 'rgba(70,205,70,A)'],
      [0.36, 0.13, YAHUAH,   65, 0.42, 'rgba(195,210,255,A)', 'rgba(90,125,255,A)'],
      [0.93, 0.64, YAHUSHA,  70, 0.48, 'rgba(255,232,170,A)', 'rgba(255,195,50,A)'],
      [0.03, 0.57, YAHUAH,   60, 0.38, 'rgba(165,248,238,A)', 'rgba(20,205,195,A)'],
      [0.75, 0.08, YAHUSHA,  62, 0.42, 'rgba(248,190,248,A)', 'rgba(205,70,205,A)'],
      [0.46, 0.95, YAHUAH,   68, 0.44, 'rgba(255,255,215,A)', 'rgba(255,252,140,A)'],
    ];

    names.forEach(([xf,yf,txt,sz,al,letterCol,glowCol])=>{
      const tx=xf*W, ty=yf*H;
      ctx.save();

      // Bloom aura
      const auraR=sz*3.8;
      const aura=ctx.createRadialGradient(tx,ty,0,tx,ty,auraR);
      aura.addColorStop(0,   glowCol.replace('A',(al*0.28).toFixed(3)));
      aura.addColorStop(0.35,glowCol.replace('A',(al*0.10).toFixed(3)));
      aura.addColorStop(1,   glowCol.replace('A','0'));
      ctx.fillStyle=aura;
      ctx.beginPath(); ctx.arc(tx,ty,auraR,0,Math.PI*2); ctx.fill();

      ctx.font=`bold ${sz}px serif`;
      ctx.textAlign='center';
      ctx.textBaseline='middle';

      // Wide glow pass
      ctx.shadowColor=glowCol.replace('A','1');
      ctx.shadowBlur=sz*2.2;
      ctx.fillStyle=glowCol.replace('A',(al*0.22).toFixed(3));
      ctx.fillText(txt,tx,ty);

      // Mid glow pass
      ctx.shadowBlur=sz*1.0;
      ctx.fillStyle=letterCol.replace('A',(al*0.65).toFixed(3));
      ctx.fillText(txt,tx,ty);

      // Sharp bright core
      ctx.shadowBlur=sz*0.3;
      ctx.fillStyle=letterCol.replace('A',Math.min(al+0.18,0.98).toFixed(3));
      ctx.fillText(txt,tx,ty);

      ctx.restore();
    });

  });
}

function makeCeilTex(){
  return mkTex(4096,4096,(ctx,W,H)=>{
    ctx.fillStyle='#000000'; ctx.fillRect(0,0,W,H);
    // 4x4 coffered panels
    const cols=4,rows=4,cw=W/cols,ch=H/rows,cmg=cw*0.07;
    for(let cpx=0;cpx<cols;cpx++) for(let cpy=0;cpy<rows;cpy++){
      const x=cpx*cw+cmg,y=cpy*ch+cmg,w=cw-cmg*2,h=ch-cmg*2;
      // Recessed shadow
      const sdw=ctx.createRadialGradient(x+w/2,y+h/2,0,x+w/2,y+h/2,Math.max(w,h)*0.7);
      sdw.addColorStop(0,'rgba(0,0,0,0.05)'); sdw.addColorStop(1,'rgba(0,0,0,0.75)');
      ctx.fillStyle=sdw; ctx.fillRect(x,y,w,h);
      ctx.fillStyle='rgba(0,0,0,1)'; ctx.fillRect(x+4,y+4,w-8,h-8);
      ctx.strokeStyle='rgba(215,155,160,0.50)'; ctx.lineWidth=3.5; ctx.strokeRect(x,y,w,h);
      ctx.strokeStyle='rgba(183,110,121,0.18)'; ctx.lineWidth=1.5; ctx.strokeRect(x+16,y+16,w-32,h-32);
    }
    // LED strip glows along every rib - horizontal
    for(let r=0;r<=rows;r++){
      const gy=r*ch;
      const lg=ctx.createLinearGradient(0,gy-18,0,gy+18);
      lg.addColorStop(0,'rgba(0,0,0,0)'); lg.addColorStop(0.5,'rgba(255,195,145,0.22)'); lg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=lg; ctx.fillRect(0,gy-18,W,36);
      ctx.fillStyle='rgba(255,215,175,0.42)'; ctx.fillRect(0,gy-2,W,4);
    }
    // Vertical
    for(let c=0;c<=cols;c++){
      const gxx=c*cw;
      const lg2=ctx.createLinearGradient(gxx-18,0,gxx+18,0);
      lg2.addColorStop(0,'rgba(0,0,0,0)'); lg2.addColorStop(0.5,'rgba(255,195,145,0.22)'); lg2.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=lg2; ctx.fillRect(gxx-18,0,36,H);
      ctx.fillStyle='rgba(255,215,175,0.42)'; ctx.fillRect(gxx-2,0,4,H);
    }
    // Center medallion ring
    ctx.beginPath(); ctx.arc(W/2,H/2,130,0,Math.PI*2);
    ctx.strokeStyle='rgba(215,155,160,0.55)'; ctx.lineWidth=5; ctx.stroke();
    ctx.beginPath(); ctx.arc(W/2,H/2,95,0,Math.PI*2);
    ctx.strokeStyle='rgba(215,155,160,0.28)'; ctx.lineWidth=2.5; ctx.stroke();
    const cg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,160);
    cg.addColorStop(0,'rgba(255,205,165,0.12)'); cg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=cg; ctx.fillRect(0,0,W,H);
    for(let i=0;i<4000;i++){ctx.fillStyle=`rgba(20,8,8,${(Math.random()*0.04).toFixed(3)})`;ctx.fillRect(Math.random()*W,Math.random()*H,1,1);}
  });
}

function makeLogoTex(){
  return mkTex(3200,640,(ctx,W,H)=>{
    ctx.clearRect(0,0,W,H);
    // Fully transparent background — letters float on the wall
    const cx=W/2;

    // -- Crosshair icon - premium metallic, NO shadowBlur ---------------------
    const iconX=cx-1100, iconY=H*0.50, iconR=200;
    ctx.shadowBlur=0;

    // 3D depth rings - layered shadow for emboss feel
    for(let i=22;i>0;i--){
      ctx.strokeStyle=`rgba(40,10,14,${i/22*0.18})`; ctx.lineWidth=i*4.5;
      ctx.beginPath(); ctx.arc(iconX,iconY,iconR,0,Math.PI*2); ctx.stroke();
    }

    // Primary metallic ring - copper-to-rose-gold swept gradient
    const circG=ctx.createLinearGradient(iconX-iconR,iconY-iconR,iconX+iconR,iconY+iconR);
    circG.addColorStop(0,   '#4a1e26'); // deep shadow edge
    circG.addColorStop(0.08,'#7a3828'); // dark copper
    circG.addColorStop(0.20,'#c07840'); // warm copper
    circG.addColorStop(0.35,'#e8a870'); // bright bronze
    circG.addColorStop(0.48,'#d4919e'); // rose gold peak
    circG.addColorStop(0.60,'#eabf88'); // light copper
    circG.addColorStop(0.75,'#c07038'); // mid copper
    circG.addColorStop(0.88,'#8a4830'); // deep copper
    circG.addColorStop(1,   '#5a2828'); // shadow base
    ctx.strokeStyle=circG; ctx.lineWidth=36; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(iconX,iconY,iconR,0,Math.PI*2); ctx.stroke();

    // Specular highlight arc - top-left catch
    const specArc=ctx.createLinearGradient(iconX-iconR,iconY-iconR,iconX,iconY);
    specArc.addColorStop(0,'rgba(255,235,200,0.0)');
    specArc.addColorStop(0.3,'rgba(255,240,210,0.65)');
    specArc.addColorStop(0.55,'rgba(255,245,220,0.80)');
    specArc.addColorStop(1,'rgba(255,235,200,0.0)');
    ctx.strokeStyle=specArc; ctx.lineWidth=6; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(iconX,iconY,iconR,-Math.PI*0.9,-Math.PI*0.05); ctx.stroke();

    // Inner concentric ring
    ctx.strokeStyle='rgba(185,118,58,0.50)'; ctx.lineWidth=14; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(iconX,iconY,iconR*0.62,0,Math.PI*2); ctx.stroke();

    // Crosshair lines - tapered copper
    [[1,0],[0,1]].forEach(([dx,dy])=>{
      const cg=ctx.createLinearGradient(
        iconX-iconR*dx,iconY-iconR*dy,
        iconX+iconR*dx,iconY+iconR*dy
      );
      cg.addColorStop(0,'rgba(180,100,40,0)');
      cg.addColorStop(0.18,'#c87840');
      cg.addColorStop(0.5,'#ecba94');
      cg.addColorStop(0.82,'#c87840');
      cg.addColorStop(1,'rgba(180,100,40,0)');
      ctx.strokeStyle=cg; ctx.lineWidth=13; ctx.shadowBlur=0;
      ctx.beginPath();
      ctx.moveTo(iconX-iconR*1.06*dx, iconY-iconR*1.06*dy);
      ctx.lineTo(iconX+iconR*1.06*dx, iconY+iconR*1.06*dy);
      ctx.stroke();
    });

    // Tick marks - precision instrument feel
    ctx.strokeStyle='rgba(210,148,72,0.80)'; ctx.lineWidth=9; ctx.shadowBlur=0;
    [-1,1].forEach(dir=>{
      [0.76,0.87,0.96].forEach(d=>{
        ctx.beginPath(); ctx.moveTo(iconX+iconR*d*dir,-16+iconY); ctx.lineTo(iconX+iconR*d*dir,16+iconY); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(iconX-16,iconY+iconR*d*dir); ctx.lineTo(iconX+16,iconY+iconR*d*dir); ctx.stroke();
      });
    });

    // House silhouette - layered metallic build
    const hx=iconX, hy=iconY+32;
    const hScale=1.85;

    // Shadow depth base
    ctx.fillStyle='rgba(20,4,6,0.75)'; ctx.shadowBlur=0;
    ctx.beginPath();
    ctx.moveTo(hx-70*hScale,hy-40*hScale);
    ctx.lineTo(hx,hy-120*hScale);
    ctx.lineTo(hx+70*hScale,hy-40*hScale);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.rect(hx-52*hScale,hy-40*hScale,104*hScale,92*hScale); ctx.fill();

    // Roof - swept copper gradient
    const roofG=ctx.createLinearGradient(hx-65*hScale,hy-115*hScale,hx+65*hScale,hy-36*hScale);
    roofG.addColorStop(0,'#5a2028'); roofG.addColorStop(0.25,'#c07840');
    roofG.addColorStop(0.55,'#ecb488'); roofG.addColorStop(1,'#883828');
    ctx.fillStyle=roofG;
    ctx.beginPath();
    ctx.moveTo(hx-68*hScale,hy-37*hScale);
    ctx.lineTo(hx,hy-118*hScale);
    ctx.lineTo(hx+68*hScale,hy-37*hScale);
    ctx.closePath(); ctx.fill();

    // Specular hit on roof peak
    ctx.fillStyle='rgba(255,230,185,0.22)';
    ctx.beginPath();
    ctx.moveTo(hx-10,hy-118*hScale);
    ctx.lineTo(hx+10,hy-118*hScale);
    ctx.lineTo(hx+32*hScale,hy-60*hScale);
    ctx.lineTo(hx-32*hScale,hy-60*hScale);
    ctx.closePath(); ctx.fill();

    // Body - rose gold to copper
    const bodyG=ctx.createLinearGradient(hx-50*hScale,hy-38*hScale,hx+50*hScale,hy+52*hScale);
    bodyG.addColorStop(0,'#cc7e8c'); bodyG.addColorStop(0.45,'#a85848'); bodyG.addColorStop(1,'#682828');
    ctx.fillStyle=bodyG;
    ctx.beginPath(); ctx.rect(hx-50*hScale,hy-38*hScale,100*hScale,92*hScale); ctx.fill();

    // Chimney
    const chimG=ctx.createLinearGradient(hx+18*hScale,hy-128*hScale,hx+40*hScale,hy-70*hScale);
    chimG.addColorStop(0,'#c07840'); chimG.addColorStop(1,'#7a3828');
    ctx.fillStyle=chimG;
    ctx.beginPath(); ctx.rect(hx+16*hScale,hy-128*hScale,22*hScale,56*hScale); ctx.fill();

    // Door - arched top
    ctx.fillStyle='rgba(4,1,2,0.94)';
    ctx.beginPath();
    ctx.arc(hx,hy+20*hScale,16*hScale,Math.PI,0);
    ctx.rect(hx-16*hScale,hy+20*hScale,32*hScale,34*hScale);
    ctx.fill();

    // Window - left
    ctx.fillStyle='rgba(255,210,140,0.18)';
    ctx.strokeStyle='rgba(200,135,65,0.70)'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.rect(hx-42*hScale,hy-22*hScale,22*hScale,20*hScale); ctx.fill(); ctx.stroke();

    // Window - right
    ctx.beginPath(); ctx.rect(hx+20*hScale,hy-22*hScale,22*hScale,20*hScale); ctx.fill(); ctx.stroke();

    // -- TRUESITE text - BLACK letters with RGB border glow -------------------
    const FONT_SIZE = 360;
    const tx=cx-920, ty=H*0.60;
    ctx.font=`900 ${FONT_SIZE}px Arial Black,Arial`; ctx.textBaseline='alphabetic';

    // Pass 1: outermost wide color bloom — red channel
    ctx.save();
    ctx.shadowColor='rgba(255,0,80,1)';
    ctx.shadowBlur=80;
    ctx.strokeStyle='rgba(255,0,80,0.0)'; // shadow only, invisible stroke
    ctx.lineWidth=1;
    ctx.lineJoin='round';
    ctx.strokeText('TRUESITE',tx,ty);
    ctx.restore();

    // Pass 2: green channel bloom
    ctx.save();
    ctx.shadowColor='rgba(0,255,120,1)';
    ctx.shadowBlur=60;
    ctx.strokeStyle='rgba(0,255,120,0.0)';
    ctx.lineWidth=1;
    ctx.lineJoin='round';
    ctx.strokeText('TRUESITE',tx,ty);
    ctx.restore();

    // Pass 3: blue channel bloom
    ctx.save();
    ctx.shadowColor='rgba(80,100,255,1)';
    ctx.shadowBlur=50;
    ctx.strokeStyle='rgba(80,100,255,0.0)';
    ctx.lineWidth=1;
    ctx.lineJoin='round';
    ctx.strokeText('TRUESITE',tx,ty);
    ctx.restore();

    // Pass 4: bright white tight border glow around each letter edge
    ctx.save();
    ctx.shadowColor='rgba(255,255,255,1)';
    ctx.shadowBlur=18;
    ctx.strokeStyle='rgba(255,255,255,0.95)';
    ctx.lineWidth=4;
    ctx.lineJoin='round';
    ctx.strokeText('TRUESITE',tx,ty);
    ctx.restore();

    // Pass 5: outer colored border stroke — rose-gold ring
    ctx.save();
    ctx.shadowColor='rgba(212,145,158,1)';
    ctx.shadowBlur=24;
    ctx.strokeStyle='rgba(232,160,170,0.80)';
    ctx.lineWidth=10;
    ctx.lineJoin='round';
    ctx.strokeText('TRUESITE',tx,ty);
    ctx.restore();

    // Pass 6: pure BLACK fill on top — letters are black, only the border glows
    ctx.shadowBlur=0;
    ctx.fillStyle='#000000';
    ctx.fillText('TRUESITE',tx,ty);

    // -- TECHNOLOGIES subtext — black letters + border glow -------------------
    const SUB_SIZE=148;
    const subx=cx-900, suby=ty+160;
    ctx.font=`700 ${SUB_SIZE}px Arial`; ctx.textBaseline='alphabetic';

    // RGB bloom passes
    ctx.save();
    ctx.shadowColor='rgba(255,0,80,1)';
    ctx.shadowBlur=50;
    ctx.strokeStyle='rgba(255,0,80,0.0)';
    ctx.lineWidth=1;
    ctx.strokeText('TECHNOLOGIES',subx,suby);
    ctx.restore();

    ctx.save();
    ctx.shadowColor='rgba(0,255,120,1)';
    ctx.shadowBlur=38;
    ctx.strokeStyle='rgba(0,255,120,0.0)';
    ctx.lineWidth=1;
    ctx.strokeText('TECHNOLOGIES',subx,suby);
    ctx.restore();

    ctx.save();
    ctx.shadowColor='rgba(80,100,255,1)';
    ctx.shadowBlur=30;
    ctx.strokeStyle='rgba(80,100,255,0.0)';
    ctx.lineWidth=1;
    ctx.strokeText('TECHNOLOGIES',subx,suby);
    ctx.restore();

    // White tight border
    ctx.save();
    ctx.shadowColor='rgba(255,255,255,1)';
    ctx.shadowBlur=12;
    ctx.strokeStyle='rgba(255,255,255,0.90)';
    ctx.lineWidth=3;
    ctx.lineJoin='round';
    ctx.strokeText('TECHNOLOGIES',subx,suby);
    ctx.restore();

    // Rose-gold border
    ctx.save();
    ctx.shadowColor='rgba(212,145,158,1)';
    ctx.shadowBlur=16;
    ctx.strokeStyle='rgba(232,160,170,0.72)';
    ctx.lineWidth=6;
    ctx.lineJoin='round';
    ctx.strokeText('TECHNOLOGIES',subx,suby);
    ctx.restore();

    // BLACK fill
    ctx.shadowBlur=0;
    ctx.fillStyle='#000000';
    ctx.fillText('TECHNOLOGIES',subx,suby);

    // -- UNDERGLOW - subtle glow only, no background panels -------------------
    // Just a very faint halo so the letters don't look floating in dead space

    // LED strip - the hot white line itself
    const ledLine=ctx.createLinearGradient(cx-1160,0,cx+1160,0);
    ledLine.addColorStop(0,  'rgba(255,230,200,0)');
    ledLine.addColorStop(0.18,'rgba(255,228,188,0.96)');
    ledLine.addColorStop(0.5, 'rgba(255,250,230,1.0)');
    ledLine.addColorStop(0.82,'rgba(255,228,188,0.96)');
    ledLine.addColorStop(1,  'rgba(255,230,200,0)');
    ctx.strokeStyle=ledLine; ctx.lineWidth=5; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.moveTo(cx-1160,H*0.862); ctx.lineTo(cx+1160,H*0.862); ctx.stroke();
  });
}

// -- Logo image loader - CanvasTexture ----------------------------------------
function makeLogoScreen(imgUrl, label, accentCol) {
  const W=640,H=400;
  const canvas=mkCanvas(W,H);
  const ctx=canvas.getContext('2d');
  // dark background
  ctx.fillStyle='#030202'; ctx.fillRect(0,0,W,H);
  // subtle grid
  ctx.strokeStyle='rgba(183,110,121,0.06)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // placeholder fill while image loads
  ctx.fillStyle=accentCol; ctx.font='bold 18px Courier New'; ctx.textAlign='center';
  ctx.fillText(label,W/2,H/2);
  const tex=new THREE.CanvasTexture(canvas);
  tex.colorSpace=THREE.SRGBColorSpace; tex.needsUpdate=true;
  // load image async and repaint
  const img=new Image(); img.crossOrigin='anonymous';
  img.onload=()=>{
    ctx.fillStyle='#030202'; ctx.fillRect(0,0,W,H);
    // subtle vignette
    const vg=ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
    // fit image centered
    const scale=Math.min((W*0.78)/img.width,(H*0.78)/img.height);

// -- Video texture maker -------------------------------------------------------
function makeVideoTex(url) {
  const vid=document.createElement('video');
  vid.src=url; vid.crossOrigin='anonymous';
  vid.loop=true; vid.muted=true; vid.playsInline=true;
  vid.autoplay=true;
  // Must be triggered after user gesture or autoplay policy - we attempt on load
  const tex=new THREE.VideoTexture(vid);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.minFilter=THREE.LinearFilter;
  tex.magFilter=THREE.LinearFilter;
  tex.generateMipmaps=false;
  tex.anisotropy=16;
  // Try to play; browsers may block until interaction
  vid.addEventListener('canplaythrough',()=>{ vid.play().catch(()=>{}); },{once:true});
  document.addEventListener('click',()=>{ vid.play().catch(()=>{});   _nitroBialVid.play().catch(()=>{});
},{once:true});
  return tex;
}

function addScreen(tex,w,h,px,py,pz,ry){
  const offX=Math.abs(ry)>0.1?(ry>0?0.08:-0.08):0;
  const offZ=Math.abs(ry)<0.1?0.08:0;

  // ── Screen emission plane — MeshStandardMaterial with emissive glow ──────
  const screenMat=new THREE.MeshStandardMaterial({
    map:tex,
    emissiveMap:tex,
    emissive:new THREE.Color(0xffffff),
    emissiveIntensity:0.22,
    toneMapped:false,
    roughness:0.0,
    metalness:0.0
  });
  const s=new THREE.Mesh(new THREE.PlaneGeometry(w,h),screenMat);
  s.position.set(px+offX,py,pz+offZ); s.rotation.y=ry;
  s.castShadow=false; s.receiveShadow=false;
  scene.add(s);

  // ── Deep housing body — thick slab, dark brushed metal ───────────────────
  const housingMat=new THREE.MeshStandardMaterial({
    color:new THREE.Color(0x0a0608),
    roughness:0.35,
    metalness:0.88,
    envMapIntensity:1.4
  });
  const housing=new THREE.Mesh(new THREE.BoxGeometry(w+0.28,h+0.28,0.14),housingMat);
  housing.position.set(px,py,pz); housing.rotation.y=ry;
  housing.castShadow=true; housing.receiveShadow=true;
  scene.add(housing);

  // ── Outer bezel ring — polished rose-gold bevel ───────────────────────────
  const bezelMat=new THREE.MeshStandardMaterial({
    color:new THREE.Color(0xc07840),
    roughness:0.08,
    metalness:0.96,
    envMapIntensity:2.2
  });
  const bezel=new THREE.Mesh(new THREE.BoxGeometry(w+0.48,h+0.48,0.08),bezelMat);
  bezel.position.set(px,py,pz); bezel.rotation.y=ry;
  scene.add(bezel);

  // ── Inner thin accent line — bright gold ring inside bezel ───────────────
  const accentMat=new THREE.MeshStandardMaterial({
    color:new THREE.Color(0xffe0a0),
    emissive:new THREE.Color(0xffcc80),
    emissiveIntensity:0.55,
    roughness:0.04,
    metalness:1.0
  });
  const accent=new THREE.Mesh(new THREE.BoxGeometry(w+0.30,h+0.30,0.09),accentMat);
  accent.position.set(px,py,pz); accent.rotation.y=ry;
  scene.add(accent);

  // ── Screen-cast light — colored ambient bounce off wall ──────────────────
  const ox=Math.abs(ry)>0.1?(ry>0?1.4:-1.4):0;
  const oz=Math.abs(ry)<0.1?1.4:0;
  const screenLight=new THREE.PointLight(0x5599dd,1.1,12,2);
  screenLight.position.set(px+ox,py,pz+oz); scene.add(screenLight);

  // ── Under-screen LED strip glow ───────────────────────────────────────────
  const ledLight=new THREE.PointLight(0xd4919e,0.55,5,2);
  ledLight.position.set(px+ox*0.3, py-(h/2+0.3), pz+oz*0.3); scene.add(ledLight);

  // ── Subtle screen-face specular quad — glass reflection feel ─────────────
  const glassMat=new THREE.MeshStandardMaterial({
    color:new THREE.Color(0xffffff),
    transparent:true,
    opacity:0.04,
    roughness:0.0,
    metalness:0.0,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });

  glassQuad.position.set(px+offX*1.1,py,pz+offZ*1.1); glassQuad.rotation.y=ry;
  scene.add(glassQuad);

  return s;
}

// -- Table edge band - engraved sequence 3-5-6-5-3-6-9-9-6-3 -----------------
// Each character illuminates one by one, cycling around the full circumference
const SEQUENCE='3|5|6|5|3|6|9|9|6|3|';
const EDGE_W=4096, EDGE_H=160;
const EDGE_FONT=`bold ${Math.round(EDGE_H*0.52)}px Georgia,serif`;

// -- Off-screen measurement canvas --------------------------------------------
const _emx=(()=>{const c=document.createElement('canvas');c.width=64;c.height=64;return c.getContext('2d');})();
_emx.font=EDGE_FONT;

// Build full repeating character list with x positions
const edgeChars=[]; // [{char, x, w}]
{
  // measure one tile
  let tileW=0;
  for(const ch of SEQUENCE){ tileW+=_emx.measureText(ch).width*0.90; }
  const numTiles=Math.ceil(EDGE_W/tileW)+2;
  const fullSeq=SEQUENCE.repeat(numTiles);
  let px=6;
  for(const ch of fullSeq){
    const cw=_emx.measureText(ch).width*0.90;
    if(px>EDGE_W+80) break;
    edgeChars.push({char:ch, x:px, w:cw});
    px+=cw;
  }
}
const TOTAL_CHARS=edgeChars.length;
// Seconds for one full lap around all chars
const LAP_SECS=20;

// -- Live draw canvas (redrawn every frame) -----------------------------------
const edgeLiveCanvas=document.createElement('canvas');
edgeLiveCanvas.width=EDGE_W; edgeLiveCanvas.height=EDGE_H;
const elx=edgeLiveCanvas.getContext('2d');
const edgeTex=new THREE.CanvasTexture(edgeLiveCanvas);
edgeTex.colorSpace=THREE.SRGBColorSpace;
edgeTex.needsUpdate=true;

const edgeBand=new THREE.Mesh(
  new THREE.CylinderGeometry(4.503,4.503,0.40,256,1,true),
  new THREE.MeshBasicMaterial({map:edgeTex,side:THREE.DoubleSide,transparent:false,toneMapped:false})
);
edgeBand.position.y=TABLE_Y; scene.add(edgeBand);

// Track last active char to throttle redraws
let _edgeLastIdx=-1;

function drawEdgeBand(t,dt){
  // Continuous fractional position - NO floor/snap, moves fluidly
  const progress=(t%LAP_SECS)/LAP_SECS;   // 0.0 -> 1.0 continuously
  const activePos=progress*TOTAL_CHARS;    // fractional index, e.g. 47.63

  // Throttle redraws to ~30fps max (no need faster for smooth look)
  if(t-(_edgeLastIdx||0)<0.033) return;
  _edgeLastIdx=t;

  elx.clearRect(0,0,EDGE_W,EDGE_H);

  // -- Pitch-black base ------------------------------------------------------
  elx.fillStyle='#050101'; elx.fillRect(0,0,EDGE_W,EDGE_H);

  // Carved border lines top & bottom (static - drawn once per frame, fast)
  [EDGE_H*0.10, EDGE_H*0.90].forEach(gy=>{
    elx.beginPath(); elx.moveTo(0,gy); elx.lineTo(EDGE_W,gy);
    elx.strokeStyle='rgba(0,0,0,0.75)'; elx.lineWidth=3; elx.stroke();
    elx.beginPath(); elx.moveTo(0,gy+1.5); elx.lineTo(EDGE_W,gy+1.5);
    elx.strokeStyle='rgba(140,100,70,0.10)'; elx.lineWidth=1; elx.stroke();
  });

  // -- Smooth brightness falloff function ------------------------------------
  // Uses a cosine bell curve - peaks at dist=0, smoothly falls to 0 at dist=WINDOW
  const WINDOW=6; // how many chars on each side the glow reaches
  function brightness(i){
    // Signed fractional distance from the active position (wrap-aware)
    let d=i-activePos;
    // Wrap to shortest path around the circle
    if(d> TOTAL_CHARS/2) d-=TOTAL_CHARS;
    if(d<-TOTAL_CHARS/2) d+=TOTAL_CHARS;
    const absd=Math.abs(d);
    if(absd>=WINDOW) return 0;
    // Cosine ease: 1.0 at center - 0.0 at WINDOW
    return 0.5*(1+Math.cos(Math.PI*absd/WINDOW));
  }

  // -- Draw all characters ----------------------------------------------------
  elx.font=EDGE_FONT;
  elx.textBaseline='middle';
  const cy=EDGE_H*0.5;

  for(let i=0;i<edgeChars.length;i++){
    const {char,x,w}=edgeChars[i];
    const b=brightness(i); // 0.0 -> 1.0

    if(b>0.01){
      // -- Illuminated range ------------------------------------------------
      // Halo glow - scales with brightness
      if(b>0.3){
        const halo=elx.createRadialGradient(x+w/2,cy,0,x+w/2,cy,w*2.2);
        halo.addColorStop(0,`rgba(255,248,190,${(b*0.45).toFixed(3)})`);
        halo.addColorStop(0.4,`rgba(230,190,90,${(b*0.20).toFixed(3)})`);
        halo.addColorStop(1,'rgba(0,0,0,0)');
        elx.fillStyle=halo;
        elx.fillRect(x-w,cy-EDGE_H*0.42,w*3,EDGE_H*0.84);
      }
      // Carve shadow (always present for depth)
      elx.fillStyle=`rgba(0,0,0,0.80)`;
      elx.fillText(char,x+1.5,cy+1.8);
      // Gold-white character - brightness drives opacity and warmth
      const r=Math.round(255);
      const g=Math.round(200+b*52);   // 200->252 as b->1
      const bch=Math.round(80+b*130); // 80->210 as b->1
      elx.fillStyle=`rgba(${r},${g},${bch},${(0.15+b*0.85).toFixed(3)})`;
      elx.fillText(char,x,cy);
      // Specular highlight at peak only
      if(b>0.7){
        elx.fillStyle=`rgba(255,255,255,${(b*0.4).toFixed(3)})`;
        elx.fillText(char,x-0.6,cy-0.7);
      }
    } else {
      // -- Dark / engraved - invisible base with faint carved edge ----------
      elx.fillStyle='rgba(0,0,0,0.80)';
      elx.fillText(char,x+1.4,cy+1.6);
      elx.fillStyle='rgba(6,2,1,0.92)';
      elx.fillText(char,x,cy);
      elx.fillStyle='rgba(70,48,32,0.17)';
      elx.fillText(char,x-0.7,cy-0.8);
    }
  }

  edgeTex.needsUpdate=true;
}

// Build the bevel texture - wraps around the torus circumference
const rimTex=(()=>{
  const RW=8192, RH=192; // bigger canvas = more resolution per character
  const rc=document.createElement('canvas'); rc.width=RW; rc.height=RH;
  const rx=rc.getContext('2d');

  // Cherry-red base
  const bg=rx.createLinearGradient(0,0,0,RH);
  bg.addColorStop(0,'#3a0c08');
  bg.addColorStop(0.4,'#4a1008');
  bg.addColorStop(0.6,'#3d0e07');
  bg.addColorStop(1,'#220807');
  rx.fillStyle=bg; rx.fillRect(0,0,RW,RH);

  // Thin carved border lines top & bottom
  [RH*0.05, RH*0.95].forEach(gy=>{
    rx.beginPath(); rx.moveTo(0,gy); rx.lineTo(RW,gy);
    rx.strokeStyle='rgba(0,0,0,0.80)'; rx.lineWidth=4; rx.stroke();
    rx.beginPath(); rx.moveTo(0,gy+2); rx.lineTo(RW,gy+2);
    rx.strokeStyle='rgba(255,210,180,0.18)'; rx.lineWidth=1.5; rx.stroke();
  });

  // Hebrew text - sized to fill most of the band height
  const FONT_SIZE=Math.round(RH*0.55);
  rx.font=`${FONT_SIZE}px 'Times New Roman',serif`;
  rx.textBaseline='middle';
  rx.direction='ltr';

  // Tile across full width
  const tileW=rx.measureText(SCRIPTURE_HEB).width*0.90;
  const numTiles=Math.ceil(RW/tileW)+2;
  const fullText=SCRIPTURE_HEB.repeat(numTiles);

  let tx=10;
  const chars=[...fullText];
  for(let ci=0;ci<chars.length && tx<RW+80;ci++){
    const ch=chars[ci];
    const cw=rx.measureText(ch).width*0.90;

    // === ENGRAVED look: dark groove + strong bright highlight catch ===
    // Shadow drop - the groove is deep
    rx.fillStyle='rgba(0,0,0,0.95)';
    rx.fillText(ch, tx+2, RH*0.5+2.5);

    // Groove floor - very dark red-brown
    rx.fillStyle='rgba(12,3,2,1.0)';
    rx.fillText(ch, tx, RH*0.5);

    // PRIMARY highlight - bright gold-white edge catch (top-left)
    // This is what makes engraving readable - the light catches the raised edge
    rx.fillStyle='rgba(255,220,170,0.72)';
    rx.fillText(ch, tx-1.2, RH*0.5-1.5);

    // Secondary soft highlight
    rx.fillStyle='rgba(220,180,130,0.40)';
    rx.fillText(ch, tx-0.5, RH*0.5-0.6);

    tx+=cw;
  }

  const t=new THREE.CanvasTexture(rc);
  t.colorSpace=THREE.SRGBColorSpace;
  t.needsUpdate=true;
  return t;
})();

let lastFOL=-1;
function drawFOL(t){
  if(t-lastFOL<0.045)return; lastFOL=t;
  const S=1024, C=512;
  folCtx.clearRect(0,0,S,S);

  const{r,g,b}=getColor(t);
  const d=1/PHI;
  // Phi-shifted secondary color
  const r2c=Math.round(r*d), g2c=Math.round(g*d), b2c=Math.round(b*d);

  // Scale: R=88 matches the 512->1024 upscale of original R=44
  const R=88;

  // -- Helper: draw one carved circle --------------------------------------
  function carvedCircle(cx,cy,radius,phiR,phiG,phiB,alpha){
    // 1. Outer shadow lip - dark edge that sells the depth illusion
    folCtx.beginPath();
    folCtx.arc(cx,cy,radius+2.5,0,Math.PI*2);
    folCtx.strokeStyle=`rgba(0,0,0,0.55)`;
    folCtx.lineWidth=5;
    folCtx.stroke();

    // 2. Inner shadow - the groove floor is darker
    folCtx.beginPath();
    folCtx.arc(cx,cy,radius,0,Math.PI*2);
    folCtx.strokeStyle=`rgba(0,0,0,0.40)`;
    folCtx.lineWidth=6;
    folCtx.stroke();

    // 3. Highlight lip on opposite side - simulates light catching the groove edge
    folCtx.save();
    folCtx.beginPath();
    folCtx.arc(cx,cy,radius-1,Math.PI*1.1,Math.PI*1.9);
    folCtx.strokeStyle=`rgba(255,240,200,0.18)`;
    folCtx.lineWidth=2;
    folCtx.stroke();
    folCtx.restore();

    // 4. Phi color pulse - faint luminance inside the groove (the carved channel glows)
    folCtx.beginPath();
    folCtx.arc(cx,cy,radius,0,Math.PI*2);
    folCtx.strokeStyle=`rgba(${phiR},${phiG},${phiB},${alpha})`;
    folCtx.lineWidth=2.2;
    folCtx.stroke();
  }

  // -- Draw FOL geometry - same sacred sequence as before ------------------
  // Center circle
  carvedCircle(C, C, R, Math.round(r), Math.round(g), Math.round(b), 0.55);

  // First ring - 6 petals
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3;
    carvedCircle(
      C+Math.cos(a)*R, C+Math.sin(a)*R,
      R,
      Math.round(r), Math.round(g), Math.round(b), 0.50
    );
  }

  // Second ring - outer petals (phi-shifted color)
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3;
    carvedCircle(
      C+Math.cos(a)*2*R, C+Math.sin(a)*2*R,
      R,
      r2c, g2c, b2c, 0.32
    );
    carvedCircle(
      C+Math.cos(a+Math.PI/6)*R*Math.sqrt(3),
      C+Math.sin(a+Math.PI/6)*R*Math.sqrt(3),
      R,
      r2c, g2c, b2c, 0.28
    );
  }

  // Outer containing circle - the boundary ring
  folCtx.beginPath();
  folCtx.arc(C,C,R*2.7,0,Math.PI*2);
  folCtx.strokeStyle=`rgba(0,0,0,0.45)`;
  folCtx.lineWidth=5; folCtx.stroke();
  folCtx.beginPath();
  folCtx.arc(C,C,R*2.7,0,Math.PI*2);
  folCtx.strokeStyle=`rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},0.22)`;
  folCtx.lineWidth=2; folCtx.stroke();

  folTex.needsUpdate=true;
}

  if(e.buttons===1){
    const dx=e.clientX-px0,dy=e.clientY-py0;
    if(Math.abs(dx)>1.5||Math.abs(dy)>1.5){isDrag=true;rotY+=dx*0.006;rotX=Math.max(-0.82,Math.min(0.18,rotX+dy*0.004));px0=e.clientX;py0=e.clientY;}
  }
});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(5.5,Math.min(25,zoom+e.deltaY*0.014));},{passive:false});
const ray=new THREE.Raycaster();
canvas.addEventListener('click',e=>{
  if(isDrag)return;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(seats.map(s=>s.userData.hit));
  if(!hits.length)return;
  const m=hits[0].object.userData.member;
  const el=document.getElementById('info');
  el.textContent=m.isMarz?'\u{1F451} Marz -- Head of the Table':`>> ${m.name} | ${m.role}`;
  el.style.opacity='1'; setTimeout(()=>el.style.opacity='0',3000);
});

// --- ANIMATE LOOP -------------------------------------------------------------
const clock=new THREE.Clock();
let lastColorUpdate=-1;
renderer.setAnimationLoop(()=>{
  if(window._nitroBialUpdate) window._nitroBialUpdate();
  const t=clock.getElapsedTime(); const delta=clock.getDelta?clock.getDelta():0.016;
  // camera orbit
  const cx=Math.sin(rotY)*zoom*Math.cos(rotX);
  const cz=Math.cos(rotY)*zoom*Math.cos(rotX);
  const cy=zoom*Math.sin(-rotX)+1.5;
  camera.position.set(cx,cy,cz); camera.lookAt(0,1.5,0);
  drawFOL(t); drawKG(t);
  drawEdgeBand(t,0.016);
  // color update - throttled to 20fps
  if(t-lastColorUpdate>0.05){
    lastColorUpdate=t;
    const{r,g,b}=getColor(t); const d=1/PHI;
    const cwCSS=`rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},0.95)`;
    const ccwCSS=`rgba(${Math.round(r*d)},${Math.round(g*d)},${Math.round(b*d)},0.82)`;
    paintRing(srcCWCtx,1024,1024,cwCSS); srcTexCW.needsUpdate=true;
    paintRing(srcCCWCtx,1024,1024,ccwCSS); srcTexCCW.needsUpdate=true;
    srcLight.color.setRGB(r/255,g/255,b/255);
    // update phi-cycle sibling globes
    seats.forEach(s=>{
      const g2=s.userData.globe;
      if(!g2||!g2.userData.isPhi)return;
      paintRing(g2.userData.cwCtx,1024,1024,cwCSS); g2.userData.cwTex.needsUpdate=true;
      paintRing(g2.userData.ccwCtx,1024,1024,ccwCSS); g2.userData.ccwTex.needsUpdate=true;
    });
  }
  // source globe
  sourceGlobe.position.y=3.2+0.10*Math.sin(t*0.6);
  sourceGlobe.rotation.y=t*0.18;
  animGlobe(sourceGlobe,t);
  // seats
  seats.forEach(s=>{
    const ph=s.userData.ph, bob=0.05*Math.sin(t*1.15+ph);
    const globe=s.userData.globe;
    if(globe){animGlobe(globe,t); globe.position.y=1.72+bob;}
    const pulse=s.userData.pulse;
    if(pulse){const sc=1+0.18*Math.sin(t*1.9+ph);pulse.scale.setScalar(sc);pulse.material.opacity=0.28+0.38*Math.sin(t*1.9+ph);}
    if(s.userData.sprite)s.userData.sprite.position.y=2.52+bob;
    if(s.userData.crown){s.userData.crown.rotation.z=t*0.5;s.userData.crown.position.y=2.1+bob;}
  });
  // hover tooltip
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(seats.map(s=>s.userData.hit));
  const tip=document.getElementById('tooltip');
  if(hits.length){
    const m=hits[0].object.userData.member;
    tip.textContent=m.isMarz?'\u{1F451} Marz -- Head of the Table':`Click to engage | ${m.name} | ${m.role}`;
    tip.style.opacity='1'; canvas.style.cursor='pointer';
  } else {
    tip.style.opacity='0'; canvas.style.cursor='grab';
  }
  composer.render();
});
</script>
</body>
</html>
